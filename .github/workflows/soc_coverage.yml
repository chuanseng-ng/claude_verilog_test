name: SoC Coverage

# GH #216 (bead nkj7): line + toggle coverage for the whole SoC cocotb regression.
#
# Runs the entire soc_all_ci regression built with Verilator --coverage-line --coverage-toggle,
# merges every per-simulation .dat, and renders a per-module table with
# tools/verif/coverage_report.py.  Method, run command, per-module table, triage and the gating
# decision: docs/verification/SOC_COVERAGE_REPORT.md.
#
# Sharding (bead 9ayu.1).  This used to be ONE serial job (74 min: 62 min of instrumented SoC
# suites + 11 min of CPU/cache/GPU suites).  It is now a fan-out that finishes in the time of its
# slowest leg:
#
#   soc_shard (matrix, NSHARDS legs) --\
#                                       >-- soc_coverage  (merge + report + gate; the job whose
#   cpu_gpu                          --/                    name is the required check)
#
# * The list of suites is ONE variable, SOC_CI_SUITES in tb/cocotb/soc/Makefile (soc_all_ci runs the
#   whole list, `make soc_ci_shard SHARD=k NSHARDS=n` a balanced slice of it).  The slice is
#   planned by tools/verif/soc_shards.py from the measured instrumented timings in
#   tools/verif/soc_shard_weights.json -- deterministic, so every leg and the merge job agree on it
#   without passing the plan around.  The heaviest suites (i2c, soc_integration, soc_cpu_gpu,
#   soc_coherency, soc_multiclock, and the slow soc_uart_boot test, which SOC_CI_SPLITS runs as three
#   TESTCASE slices) land in different shards.
# * Each shard uploads its per-simulation .dat files, its log and `suites_ran.txt` (every suite its
#   make completed).  The final job merges ALL shards' .dat with verilator_coverage (the same
#   operation the serial `soc_coverage` target performed over one directory, so the merged file is
#   byte-identical to merging the same simulations serially), and fails unless
#     - the union of the shards' suites_ran.txt is EXACTLY SOC_CI_SUITES (none lost, none run twice,
#       none unknown): `python3 tools/verif/soc_shards.py union`;
#     - the SUMMED pass count of all shard logs reaches PASS_FLOOR and no log has a failure (bead
#       p6t8: a cocotb target exits 0 over failures, so this grep is the only red-suite catch);
#     - the CPU/cache/GPU log reaches CPU_PASS_FLOOR with no failure.
# * ccache (bead b079's pattern, copied from cocotb.yml) in every compiling job.  Only main
#   (the nightly schedule, a manual dispatch on main) saves; pull requests restore.
# * The final job runs `if: always()` and fails explicitly when any shard or the CPU/GPU job did not
#   succeed.  A skipped required check counts as passing, so `needs` alone would let a red shard
#   turn the check grey instead of red.
#
# Combined report (bead 1eyv): the CPU / Phase 3 cache / Phase 4 GPU suites run instrumented the
# same way (`make -C sim coverage_cpu_gpu`, same nix Verilator, so both inputs agree on point
# identity) and are merged with the SoC data at the report level (`coverage_report.py --dat soc
# --dat cpu_gpu`).  Since bead a5ze that half is REQUIRED (no `continue-on-error`): the gate
# evaluates rtl/cpu|mem|gpu on the combined data, so a red suite, a collapsed pass count or a
# missing `cpu_gpu_merged.dat` fails the job instead of silently dropping three trees.
#
# NOT a per-PR gate.  An instrumented -O0 build is far slower than cocotb.yml's soc job, so this
# runs nightly and on demand.  The pull_request trigger is limited to the files that make up
# this report, so a change to the script, the waivers, the shard plan or this workflow is validated
# by a real run before it merges; it does not fire for RTL or testbench edits.
#
# Gating (bead s1cg, user decision 2026-10-10): the job fails if the REGRESSION fails (a red
# suite, a collapsed pass count), if no coverage data was produced, or if the "Coverage gate"
# step below fails: every triaged module (rtl/soc, rtl/periph, rtl/npu) must reach the 95 % line
# floor (after category-b waivers) and the control-signal toggle floor (1-bit scalar signals; a
# per-module ratchet in tools/verif/coverage_toggle_ratchet.txt holds the known gaps).  Bead a5ze:
# every module of rtl/cpu, rtl/mem and rtl/gpu must also reach the 95 % LINE floor, evaluated on
# the COMBINED data (SoC + CPU/cache/GPU, produced at the same commit by this workflow); the
# control-signal toggle gate stays off those three trees.  The gate step runs AFTER the merge
# steps and the summary / upload steps are `if: always()`, so a red gate or a red suite still
# publishes the report and the data.  Definition of a control signal, floors, how to add a waiver
# or raise a ratchet: SOC_COVERAGE_REPORT.md.
#
# The Verilator pin is the same contract as cocotb.yml: nix-installed (flake-pinned) Verilator
# compiles the sim, cocotb runs on the setup-python interpreter.  `nix profile install
# .#verilator` puts verilator AND verilator_coverage on PATH, which is what the merge needs
# (bead hg2's nix-Verilator-vs-coverage crash is side-stepped by the Makefile's
# PYTHON3=$(SIM_PYTHON3) override; every job here passes SIM_PYTHON3 exactly as cocotb.yml does).

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/soc_coverage.yml'
      - 'tools/verif/coverage_report.py'
      - 'tools/verif/coverage_waivers.txt'
      - 'tools/verif/coverage_toggle_ratchet.txt'
      - 'tools/verif/soc_shards.py'
      - 'tools/verif/soc_shard_weights.json'
      - 'tb/cocotb/soc/Makefile'
      - 'tb/tests/test_coverage_report.py'
      - 'tb/tests/test_coverage_waiver_anchors.py'
      - 'tb/tests/test_soc_shards.py'

concurrency:
  group: soc-coverage-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repo, and run repository-controlled Makefile and
# Python (same posture as cocotb.yml).
permissions:
  contents: read

env:
  # Number of soc_shard matrix legs.  Must equal the length of the matrix list below: every leg
  # asserts it (strategy.job-total) and the final job asserts it against the shard artifacts it got.
  NSHARDS: '8'

jobs:
  soc_shard:
    name: SoC coverage shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # A shard is ~1/8 of the old 62-minute instrumented SoC run (the longest, ~16 min, holds the single 15-minute
    # test_load_verify_jump_and_run).  Generous headroom, but still fail
    # rather than burn the 6 h default.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    env:
      # Build dirs, per-simulation .dat files and suites_ran.txt all live here.
      SOC_COV_ROOT: /home/runner/soc_cov

    steps:
      - name: Matrix size matches NSHARDS
        run: |
          if [ "${{ strategy.job-total }}" != "${NSHARDS}" ]; then
            echo "FAIL: the matrix has ${{ strategy.job-total }} legs but NSHARDS=${NSHARDS}; fix one of them."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # The Makefile's check-space gate wants >= 6 GB free.  A hosted runner normally has more than
      # that to spare for a shard (the ~6 GB of SoC build dirs of the old serial job were spread over
      # all shards), so the ~40 s of deleting unused toolchains is only paid when space is short.
      - name: Free disk space (only if short)
        run: |
          avail_mb=$(df -Pm / | awk 'NR==2 {print $4}')
          echo "free on /: ${avail_mb} MB"
          if [ "${avail_mb}" -lt 15000 ]; then
            sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
            df -h /
          fi

      - name: Install Nix (pinned Verilator from binary cache)
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Install pinned Verilator (nix profile, system-shell compile)
        run: |
          nix profile install .#verilator
          verilator --version
          command -v verilator_coverage

      # ccache (bead b079) is installed from apt, not nix: it wraps the SYSTEM g++ that
      # sim/cxx_shim.sh calls (see the shim), exactly like cocotb.yml.
      - name: Install runtime libs for cocotb
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi8 zlib1g libexpat1 libbz2-1.0 liblzma5 ccache

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'cocotb>=1.8.0,<2.0' cocotb-bus cocotbext-axi 'pyuvm>=3.0.0,<3.1' pytest pytest-cov
          pip list

      # Compiler cache for the instrumented Verilated models (bead b079; same rationale and same
      # correctness argument as cocotb.yml's step: ccache hashes the preprocessed source, the exact
      # command line and the g++ binary's content, so the key only decides which stale entries are
      # offered, and a stale one is a miss, never a wrong object).  One cache per shard, because a
      # shard compiles a fixed subset of the models.  Saved from main only, so PR runs read main's
      # cache without filling the repo's 10 GB.
      - name: Compiler identity (cache key input)
        id: cc
        run: echo "gcc=$(g++ -dumpfullversion)" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-cov-${{ runner.os }}-gcc${{ steps.cc.outputs.gcc }}-${{ hashFiles('flake.lock') }}-shard${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            ccache-cov-${{ runner.os }}-gcc${{ steps.cc.outputs.gcc }}-${{ hashFiles('flake.lock') }}-shard${{ matrix.shard }}-
            ccache-cov-${{ runner.os }}-gcc${{ steps.cc.outputs.gcc }}-shard${{ matrix.shard }}-

      # pipefail so tee cannot mask make's exit status.  No `|| true`: a failing suite fails this
      # leg (the Makefile target also refuses to finish from no data).  SIM_BUILD_JOBS: parallel C++
      # compile of each Verilated model (bead b079); it is not part of the build-directory key.
      - name: Run this shard's suites (instrumented)
        env:
          SIM_CCACHE: '1'
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 500M
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          set -o pipefail
          ccache --zero-stats
          echo "SIM_PYTHON3=$(command -v python3) ($(python3 -V))"
          python3 tools/verif/soc_shards.py plan --nshards "${NSHARDS}"
          echo "::group::make -C tb/cocotb/soc soc_coverage_shard SHARD=${{ matrix.shard }} NSHARDS=${NSHARDS}"
          make -C tb/cocotb/soc soc_coverage_shard \
            SHARD=${{ matrix.shard }} NSHARDS="${NSHARDS}" \
            SIM_BUILD_ROOT="${SOC_COV_ROOT}" \
            SIM_PYTHON3="$(command -v python3)" \
            SIM_BUILD_JOBS="$(nproc)" 2>&1 | tee soc_shard.log
          echo "::endgroup::"
          echo "::group::ccache statistics"
          ccache --show-stats | tee ccache_stats.txt
          echo "::endgroup::"

      # Same log-grep as the serial job, per shard (a fast, local failure).  The FLOOR is enforced
      # by the final job on the SUMMED counts: a shard legitimately holds only a fraction of the
      # tests, so no per-shard floor exists.
      - name: Check this shard's regression
        run: |
          if [ ! -s soc_shard.log ]; then
            echo "FAIL: no log produced - the shard did not run."
            exit 1
          fi
          passed=$(grep -cE 'cocotb\.regression .* passed$' soc_shard.log || true)
          failed=$(grep -cE 'cocotb\.regression .* (failed|FAILED)$' soc_shard.log || true)
          echo "shard ${{ matrix.shard }} (instrumented): ${passed} passed, ${failed} failed"
          if [ "${failed}" -ne 0 ]; then
            echo "FAIL: ${failed} test(s) reported failed."
            grep -E 'cocotb\.regression .* (failed|FAILED)$' soc_shard.log | head -40
            exit 1
          fi
          if [ "${passed}" -lt 1 ]; then
            echo "FAIL: no passing test in this shard's log."
            exit 1
          fi
          test -s "${SOC_COV_ROOT}/suites_ran.txt" \
            || { echo "FAIL: suites_ran.txt is missing or empty."; exit 1; }
          compgen -G "${SOC_COV_ROOT}/coverage/*.dat" > /dev/null \
            || { echo "FAIL: no .dat was produced - no coverage was collected."; exit 1; }
          echo "suites run by this shard:"; cat "${SOC_COV_ROOT}/suites_ran.txt"

      - name: Save ccache
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-cov-${{ runner.os }}-gcc${{ steps.cc.outputs.gcc }}-${{ hashFiles('flake.lock') }}-shard${{ matrix.shard }}-${{ github.sha }}

      # One staging directory so the artifact has a flat, predictable layout for the final job.
      - name: Stage shard output
        if: always()
        run: |
          mkdir -p shard_out
          cp "${SOC_COV_ROOT}"/coverage/*.dat shard_out/ 2>/dev/null || true
          cp "${SOC_COV_ROOT}/suites_ran.txt" shard_out/ 2>/dev/null || true
          cp soc_shard.log ccache_stats.txt shard_out/ 2>/dev/null || true
          find shard_out -type f | head -80

      - name: Upload shard coverage data and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soc-cov-shard-${{ matrix.shard }}
          path: shard_out
          if-no-files-found: warn
          retention-days: 7

  cpu_gpu:
    name: CPU / cache / GPU coverage
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # CPU / cache / GPU instrumented build dirs and per-simulation .dat files (bead 1eyv).
      CPU_COV_ROOT: /home/runner/cpu_cov

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Free disk space (only if short)
        run: |
          avail_mb=$(df -Pm / | awk 'NR==2 {print $4}')
          echo "free on /: ${avail_mb} MB"
          if [ "${avail_mb}" -lt 15000 ]; then
            sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
            df -h /
          fi

      - name: Install Nix (pinned Verilator from binary cache)
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Install pinned Verilator (nix profile, system-shell compile)
        run: |
          nix profile install .#verilator
          verilator --version
          command -v verilator_coverage

      - name: Install runtime libs for cocotb
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi8 zlib1g libexpat1 libbz2-1.0 liblzma5 ccache

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'cocotb>=1.8.0,<2.0' cocotb-bus cocotbext-axi 'pyuvm>=3.0.0,<3.1' pytest pytest-cov
          pip list

      # The shard planner and the Makefile list it reads, including the tests that expand
      # `soc_all_ci` / `soc_ci_shard` with make (they need Verilator and cocotb, which this job has).
      - name: Unit-test the shard planner and the SOC_CI_SUITES refactor
        run: python3 -m pytest tb/tests/test_soc_shards.py -q

      - name: Compiler identity (cache key input)
        id: cc
        run: echo "gcc=$(g++ -dumpfullversion)" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-cov-${{ runner.os }}-gcc${{ steps.cc.outputs.gcc }}-${{ hashFiles('flake.lock') }}-cpugpu-${{ github.sha }}
          restore-keys: |
            ccache-cov-${{ runner.os }}-gcc${{ steps.cc.outputs.gcc }}-${{ hashFiles('flake.lock') }}-cpugpu-
            ccache-cov-${{ runner.os }}-gcc${{ steps.cc.outputs.gcc }}-cpugpu-

      # Bead 1eyv / a5ze: CPU directed + Phase 3 cache + Phase 4 GPU suites, instrumented.  REQUIRED:
      # the gate reads rtl/cpu|mem|gpu from this data, so no continue-on-error.
      - name: Run CPU / cache / GPU coverage
        env:
          SIM_CCACHE: '1'
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 500M
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          set -o pipefail
          ccache --zero-stats
          make -C sim coverage_cpu_gpu \
            SIM_BUILD_ROOT="${CPU_COV_ROOT}" \
            SIM_PYTHON3="$(command -v python3)" 2>&1 | tee cpu_gpu_coverage.log
          echo "::group::ccache statistics"
          ccache --show-stats | tee ccache_stats.txt
          echo "::endgroup::"

      # Fast, local failure; the CPU_PASS_FLOOR is enforced by the final job (it is a gate input).
      - name: Check the CPU / cache / GPU regression
        run: |
          if [ ! -s cpu_gpu_coverage.log ]; then
            echo "FAIL: no CPU/GPU log produced - the regression did not run."
            exit 1
          fi
          passed=$(grep -cE 'cocotb\.regression .* passed$' cpu_gpu_coverage.log || true)
          failed=$(grep -cE 'cocotb\.regression .* (failed|FAILED)$' cpu_gpu_coverage.log || true)
          echo "cocotb (CPU/cache/GPU, instrumented): ${passed} passed, ${failed} failed"
          if [ "${failed}" -ne 0 ]; then
            echo "FAIL: ${failed} CPU/GPU test(s) reported failed."
            grep -E 'cocotb\.regression .* (failed|FAILED)$' cpu_gpu_coverage.log | head -40
            exit 1
          fi
          test -s "${CPU_COV_ROOT}/coverage/cpu_gpu_merged.dat" \
            || { echo "FAIL: cpu_gpu_merged.dat is missing or empty - no CPU/GPU coverage was produced."; exit 1; }

      - name: Save ccache
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-cov-${{ runner.os }}-gcc${{ steps.cc.outputs.gcc }}-${{ hashFiles('flake.lock') }}-cpugpu-${{ github.sha }}

      - name: Stage CPU/GPU output
        if: always()
        run: |
          mkdir -p cpu_gpu_out
          cp "${CPU_COV_ROOT}/coverage/cpu_gpu_merged.dat" cpu_gpu_out/ 2>/dev/null || true
          cp cpu_gpu_coverage.log ccache_stats.txt cpu_gpu_out/ 2>/dev/null || true
          find cpu_gpu_out -type f

      - name: Upload CPU/GPU coverage data and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-gpu-coverage
          path: cpu_gpu_out
          if-no-files-found: warn
          retention-days: 7

  # The job whose name is the required check ("SoC line + toggle coverage" has been this job's name
  # since before the split, so branch protection keeps working).  Merge, report and gate.
  soc_coverage:
    name: SoC line + toggle coverage
    needs: [soc_shard, cpu_gpu]
    # always(): when a leg fails this job must still run and go RED.  Without it the job is skipped
    # and a skipped required check is reported as passing.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Merged SoC data and the report live here (same paths as the serial job).
      SOC_COV_ROOT: /home/runner/soc_cov
      # The CPU/GPU .dat is staged here so the combined-report paths are unchanged.
      CPU_COV_ROOT: /home/runner/cpu_cov
      # 2026-10-07 (merge of beads 8riq + ej6j): 545 = 477 + 31 (8riq, measured 511 on its own branch) + 37 (ej6j, derived).
      # DERIVED for the merge -- tighten to (measured - 3) from this PR's soc_all CI log.
      # 2026-10-08 (GH #222 W5 / bead kp61): 546 = 545 + 1 (test_axprot_routed_to_selected_slave_only in test_axil_interconnect.py); measured 548 on main.
      # 2026-10-08 (merge of beads bq2o + 05wf): 568 = 558 measured on PR #233's soc_all CI + 13 new 05wf tests
      # (9 test_uart.py + 4 test_spi.py) - 3. Measured 571 on PR #234's CI (568 confirmed).
      # 2026-10-09 (bead oez2): 574 = 571 measured (PR #234 CI) + 6 (new suite soc_integration / test_soc_integration.py:
      # irq_traps_and_spi_miso, pll_register_programming, gpu_isolation_via_pmu, debug_apb_halt_gpr_step,
      # debug_apb_ro_write_pslverr, debug_apb_dest_reset_pslverr) - 3. Tighten from this PR's CI if it differs.
      # 2026-10-09 (bead rqvo): 575 = 574 + 1 (test_rx_false_start_then_real_start in test_uart.py; soc_all_ci
      # measured 572 pass on the pre-oez2 base). Derived -- tighten to (measured - 3) from this PR's CI.
      # 2026-10-09 (bead 7ovx): 594 = 597 measured (full local soc_coverage run, CI log-grep formula) - 3. The 597
      # includes this PR's 19 new tests: 13 test_register_walk (one per register-bank peripheral suite), 5 W1C/W1P
      # semantic tests (gpio, pwm, wdt, npu, crypto) and test_soc_register_walk in soc_integration.
      # 2026-10-10 (bead pnfw): 599 = 597 measured (7ovx, full local soc_coverage run) + 5 new I2C tests in test_i2c.py
      # (stop_to_start_gap_is_measured, stop_to_start_bus_free_time_meets_spec [expect_fail, counts as a pass],
      # fsm_illegal_state_recovers_to_idle, loopback_slave_idle_fall_arm, clkdiv_ffff_wide_tick_counter) - 3.
      # DERIVED, not measured: the i2c suite itself measured 47 -> 52 locally; the full soc_all_ci was not re-run.
      # Tighten to (measured - 3) from this PR's CI.
      # 2026-10-10 (bead gecv): 602 = 605 - 3, where 605 = 602 (pnfw's computed 599 + 3) + 3 new I2C tests in test_i2c.py
      # (start_stop_condition_times_meet_spec, busy_covers_bus_free_time, condition_tick_reloads_at_clkdiv_ffff; the
      # stop_to_start_bus_free_time_meets_spec expect_fail was removed and it now passes for real, count unchanged).
      # COMPUTED, not measured: the i2c suite itself measured 52 -> 55 locally (55/55 pass); the full soc_all_ci was
      # not re-run. Tighten to (measured - 3) from this PR's CI.
      # 2026-10-10 (bead j41m.2, DFT Stage 1a): 622 = 625 - 3, same value as cocotb.yml. 625 was MEASURED (soc_all_ci from
      # clean, 625 passed / 0 failed / 17 skipped) on the pre-merge tree: 605 on main + 20 new tests (clock_gate_scan 4,
      # dft_muxes 3, soc_dft_scan 8, cdc_reset_sync_scan +3, crypto +2). The merge of origin/main (#255-#257) touched no
      # tb/cocotb/soc file, so the count is carried over, not re-measured on the merged tree.
      # 2026-10-10 (bead j41m.9): 624 = 627 - 3, same value as cocotb.yml. 627 MEASURED: soc_all_ci from clean on the merged tree
      # (main incl. #259/#263 + this PR), 627 passed / 0 failed / 17 skipped over 62 suite summaries = the 625 above + 2 new
      # soc_dft_scan tests (PMU-held GPU/CPU domain reset in scan mode).
      # 2026-10-11 (bead j41m.3, DFT Stage 1b): 690 = 693 - 3, same value as cocotb.yml. 693 MEASURED by the cocotb soc_all job
      # of PR 270 (head 9261df1) = the 627 above + 66 new tests (jtag_tap 48, dft_ctrl 7, soc_jtag 11).
      # 2026-10-12 (bead j41m.3, glitch-free test-clock switch): 719 = 722 - 3, same value as cocotb.yml. 722 MEASURED by the
      # cocotb soc_all job of PR 270 on head 928b402 = the 693 above + 29 new tests (dft_clk_switch 19, dft_ctrl +9, soc_jtag +1).
      # 2026-10-12 (bead xtaa, merged onto main incl. PR 270): 727 = 730 - 3, same value as cocotb.yml. 730 = the 722 above
      # + 8 new tests (cdc_2ff_sync 4, periph_sync_stages 4); the xtaa branch alone MEASURED 635 on head 6759536 against
      # main's 627. Confirmed against the cocotb soc_all job of PR 274 on the merge head.
      # 2026-10-13 (bead 3snb, cdc_gray_fifo DEPTH=2): 759 = 762 - 3, same value as cocotb.yml. 762 MEASURED by the cocotb
      # soc_all job of PR 276 ('cocotb: 762 passed, 0 failed') = the 730 above + 32 new tests (cdc_gray_fifo 16 behaviours x
      # DEPTH 2 and 4).
      # 2026-10-15 (bead j41m.4, DFT CPU-macro scan boundary): 761 = 764 - 3, same value as the other workflow. 764 MEASURED:
      # soc_all_ci from clean on the branch head, 764 passed / 0 failed / 17 skipped over 72 suite summaries (the 762 above
      # + 2 new soc_dft_scan tests: test_cpu_macro_scan_boundary and test_cpu_macro_scan_boundary_tap_leg).
      # 2026-10-18 (bead j41m.14, MBIST, merged with #287/#304/#307): 813 = 816 - 3. 816 MEASURED: soc_all_ci from
      # clean on the merge of origin/main into feat/dft-mbist-j41m14 (e7cf6cf), 816 passed / 0 failed over 79 suite
      # summaries (MBIST ctrl/tap/soc_slice/fi_equiv suites + soc_uart_boot on top of main). #305's crypto tests land on top.
      # 2026-10-18 (bead shm5, UART RX re-sync): 826 = 829 - 3. 829 MEASURED: soc_all_ci from clean on the branch head,
      # 829 passed / 0 failed over 79 suite summaries (the 816 above + #305's crypto tests + 6 new: 5
      # test_uart test_rx_back_to_back_* and test_uart_boot.test_load_verify_8n1_back_to_back).
      # 2026-10-18 (beads 0ntg/4pl8/xkw5, PR #316): 823 = 826 - 3. 826 MEASURED by the sharded soc_coverage run of
      # this PR (summed over 8 shards, 0 failed): 823 on main + test_soc_dma_walk_rom_write_and_decode_errors,
      # test_soc_i2c_real_pads and test_soc_wdt_rst_en_release.
      # 2026-10-18 (merge of #316 onto #314): 829 = 832 - 3. 832 EXPECTED = 826 (#316 measured) + 6 shm5 tests;
      # confirm against the merged PR's sharded CI pass count.
      # 2026-10-18 (bead h367, I2C functional coverage): 834 = 837 - 3. 837 EXPECTED = 832 (the line above) + 5 new tests in
      # test_i2c.py (long transfers, repeated-START chain, CMD shapes, COUNT=255, RX-full timeout); the i2c suite itself
      # measured 55 -> 60 locally. Confirm against this PR's CI pass count.
      # 2026-10-18 (bead 3ogd, PMU iso-ack handshake): 835 = 838 - 3. 838 MEASURED: soc_all_ci from clean (fresh SIM_BUILD_ROOT, -j4) on
      # the merge of origin/main (#312, #315) into fix/pmu-iso-ack-3ogd, 838 passed / 0 failed over 80 suite summaries = the 816 above
      # + 7 tests already on main since then (inferred from the difference, likely #305 crypto) + 15 new (test_pmu +8, soc_pmu_iso_ack +7).
      # 2026-10-19 (bead 3ogd, PMU iso-ack handshake, merged onto #314/#316): 844 = 847 - 3. 847 EXPECTED = 832 (main, itself an
      # expectation above) + 15 new tests (test_pmu +8, new suite soc_pmu_iso_ack +7). MEASURED on the pre-#314/#316 base: 838 =
      # 823 + 15 (soc_all_ci from clean, plain AND FPGA=1, 838 passed / 0 failed over 80 suite summaries). Confirm 847 against the
      # merged PR's sharded CI pass count.
      # 2026-10-19 (bead 3ogd, PMU iso-ack handshake, merged onto #319): 849 = 852 - 3. 852 EXPECTED = 837 (main, CI-measured
      # per #319's merge) + 15 new tests (test_pmu +8, new suite soc_pmu_iso_ack +7). MEASURED on the pre-#314/#316 base: 838 =
      # 823 + 15 (soc_all_ci from clean, plain AND FPGA=1, 838 passed / 0 failed over 80 suite summaries). Confirm 852 against the
      # merged PR's sharded CI pass count.
      # 2026-10-19 (bead xkw5 leftovers, PR #320): 854 = 857 - 3. 857 MEASURED by the cocotb soc_all job of this PR on the
      # merge with #319 ('cocotb: 857 passed, 0 failed (floor 834), summed over 4 shards') = 837 + 20 new tests (timer, wdt, pwm, spi,
      # pmu, pll_apb_regs, dma, npu, 3 i2c, 2 x 2 for each of the two register-bank builds, test_soc_gpu_walk_both_masters).
      # 2026-10-19 (merge of main #317 into #320 xkw5): 869 = 872 - 3. 872 EXPECTED = 852 (main, #317 measured)
      # + xkw5's 20 new tests (857 measured on the 837 base); confirm against this merge's sharded CI pass count.
      PASS_FLOOR: '869'
      # CPU / cache / GPU half (`make -C sim coverage_cpu_gpu`), CI log-grep formula (`passed$`; the
      # expect_fail tests print "passed: failed as expected" and are NOT counted).
      # 2026-10-10 (bead a5ze slice 2): 229 = 232 - 3.  232 is the count of a full local
      # coverage_cpu_gpu run on HEAD + this branch (207 at the slice-1 base, +15 slice 1, +10 slice 2:
      # 2 icache, 5 gpu control-path kernels, 3 other); that run had 1 red line, the then-misdeclared
      # expect_fail kernel test, fixed and re-run on its own (6/6 pass), so 232 is measured but not from a
      # single all-green invocation.  Tighten to (measured - 3) from this PR's CI.
      # 2026-10-11 (bead f7z3): 248 = 251 - 3; 251 measured by a full all-green local coverage_cpu_gpu run
      # (0 failed), which includes the 11 new test_minstret_write tests.
      # 2026-10-11 (bead 6hy6): 262 = 265 - 3; 265 passed / 0 failed in CI run 38143377262
      # (soc_coverage on the merged head b7f737d = this branch + f7z3), i.e. the 254 measured on the
      # branch before the merge + the 11 minstret tests.  The branch adds 3 kernel_block_warps tests
      # and 1 warp_scheduler test.
      CPU_PASS_FLOOR: '262'

    steps:
      - name: Every shard and the CPU/GPU job succeeded
        run: |
          echo "soc_shard: ${{ needs.soc_shard.result }}"
          echo "cpu_gpu:   ${{ needs.cpu_gpu.result }}"
          if [ "${{ needs.soc_shard.result }}" != "success" ] || [ "${{ needs.cpu_gpu.result }}" != "success" ]; then
            echo "FAIL: an upstream job did not succeed (see its log); nothing can be merged or gated."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Nix (pinned Verilator from binary cache)
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # Only verilator_coverage is needed here (the merge); the same flake pin as the legs so the
      # merged file is written by the Verilator that wrote the inputs.
      - name: Install pinned Verilator (nix profile; verilator_coverage for the merge)
        run: |
          nix profile install .#verilator
          verilator --version
          command -v verilator_coverage
          verilator_coverage --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      # Cheap, runs first: the report script's own tests.  This is what the pull_request
      # trigger is really validating before the long run starts.
      - name: Unit-test the coverage report script
        run: python3 -m pytest tb/tests/test_coverage_report.py tb/tests/test_coverage_waiver_anchors.py tb/tests/test_soc_shards.py -q

      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: soc-cov-shard-*
          path: shards

      - name: Download CPU/GPU artifact
        uses: actions/download-artifact@v4
        with:
          name: cpu-gpu-coverage
          path: cpu_gpu

      # The three gates the serial job had, now over the shards:
      #  1. the suites that ran are EXACTLY SOC_CI_SUITES;
      #  2. the SUMMED pass count (same log-grep formula as cocotb.yml, bead p6t8/dwp) reaches
      #     PASS_FLOOR and no log has a failure;
      #  3. merged.dat exists.  The merge is verilator_coverage over every shard's per-simulation
      #     .dat -- the same operation the serial `soc_coverage` target ran over one directory.
      - name: Check the instrumented regression is the whole regression (summed over shards)
        run: |
          set -o pipefail
          n=$(find shards -mindepth 1 -maxdepth 1 -type d -name 'soc-cov-shard-*' | wc -l)
          echo "shard artifacts: ${n} (NSHARDS=${NSHARDS})"
          if [ "${n}" -ne "${NSHARDS}" ]; then
            echo "FAIL: expected ${NSHARDS} shard artifacts, got ${n}."
            exit 1
          fi
          for d in shards/soc-cov-shard-*; do
            for f in suites_ran.txt soc_shard.log; do
              test -s "${d}/${f}" || { echo "FAIL: ${d}/${f} is missing or empty."; exit 1; }
            done
          done
          {
            printf '## Sharded SoC regression\n\n'
            printf '| shard | suites run | tests passed | tests failed |\n|---:|---:|---:|---:|\n'
            for d in shards/soc-cov-shard-*; do
              p=$(grep -cE 'cocotb\.regression .* passed$' "${d}/soc_shard.log" || true)
              f=$(grep -cE 'cocotb\.regression .* (failed|FAILED)$' "${d}/soc_shard.log" || true)
              printf '| %s | %s | %s | %s |\n' "$(basename "${d}")" "$(wc -l < "${d}/suites_ran.txt")" "${p}" "${f}"
            done
            printf '\n'
          } >> "${GITHUB_STEP_SUMMARY}"
          python3 tools/verif/soc_shards.py union shards/soc-cov-shard-*/suites_ran.txt | tee union.txt
          cat union.txt >> "${GITHUB_STEP_SUMMARY}"
          cat shards/soc-cov-shard-*/soc_shard.log > soc_coverage.log
          passed=$(grep -cE 'cocotb\.regression .* passed$' soc_coverage.log || true)
          failed=$(grep -cE 'cocotb\.regression .* (failed|FAILED)$' soc_coverage.log || true)
          echo "cocotb (instrumented, summed over ${n} shards): ${passed} passed, ${failed} failed (floor ${PASS_FLOOR})"
          echo "cocotb summed over ${n} shards: ${passed} passed, ${failed} failed (floor ${PASS_FLOOR})" >> "${GITHUB_STEP_SUMMARY}"
          if [ "${failed}" -ne 0 ]; then
            echo "FAIL: ${failed} test(s) reported failed."
            grep -E 'cocotb\.regression .* (failed|FAILED)$' soc_coverage.log | head -40
            exit 1
          fi
          if [ "${passed}" -lt "${PASS_FLOOR}" ]; then
            echo "FAIL: only ${passed} tests passed, expected >= ${PASS_FLOOR}."
            exit 1
          fi
          mkdir -p "${SOC_COV_ROOT}/coverage"
          verilator_coverage --write "${SOC_COV_ROOT}/coverage/merged.dat" shards/soc-cov-shard-*/*.dat
          test -s "${SOC_COV_ROOT}/coverage/merged.dat" \
            || { echo "FAIL: merged.dat is missing or empty - no coverage was produced."; exit 1; }
          echo "per-simulation .dat files merged: $(find shards -name '*.dat' | wc -l)"

      # Per-module SoC report: the command the serial `soc_coverage` Makefile target ran after merging.
      - name: Per-module SoC report
        run: |
          python3 tools/verif/coverage_report.py \
            --dat "${SOC_COV_ROOT}/coverage/merged.dat" --root "${GITHUB_WORKSPACE}" \
            --waivers tools/verif/coverage_waivers.txt \
            --out-md "${SOC_COV_ROOT}/coverage/coverage_report.md" \
            --out-json "${SOC_COV_ROOT}/coverage/coverage_report.json"
          test -s "${SOC_COV_ROOT}/coverage/coverage_report.md" \
            || { echo "FAIL: coverage_report.md is missing or empty."; exit 1; }

      # Same log-grep floor as the SoC half (bead p6t8, dwp): a make target can exit 0 over a
      # suite that never ran, and an instrumented run that lost suites would hand the gate a
      # smaller regression's coverage as if it were the whole one.
      - name: Check the CPU / cache / GPU regression is the whole regression
        run: |
          log=cpu_gpu/cpu_gpu_coverage.log
          if [ ! -s "${log}" ]; then
            echo "FAIL: no CPU/GPU log produced - the regression did not run."
            exit 1
          fi
          passed=$(grep -cE 'cocotb\.regression .* passed$' "${log}" || true)
          failed=$(grep -cE 'cocotb\.regression .* (failed|FAILED)$' "${log}" || true)
          echo "cocotb (CPU/cache/GPU, instrumented): ${passed} passed, ${failed} failed (floor ${CPU_PASS_FLOOR})"
          echo "cocotb CPU/cache/GPU: ${passed} passed, ${failed} failed (floor ${CPU_PASS_FLOOR})" >> "${GITHUB_STEP_SUMMARY}"
          if [ "${failed}" -ne 0 ]; then
            echo "FAIL: ${failed} CPU/GPU test(s) reported failed."
            grep -E 'cocotb\.regression .* (failed|FAILED)$' "${log}" | head -40
            exit 1
          fi
          if [ "${passed}" -lt "${CPU_PASS_FLOOR}" ]; then
            echo "FAIL: only ${passed} CPU/GPU tests passed, expected >= ${CPU_PASS_FLOOR}."
            exit 1
          fi
          test -s cpu_gpu/cpu_gpu_merged.dat \
            || { echo "FAIL: cpu_gpu_merged.dat is missing or empty - no CPU/GPU coverage was produced."; exit 1; }
          mkdir -p "${CPU_COV_ROOT}/coverage"
          cp cpu_gpu/cpu_gpu_merged.dat "${CPU_COV_ROOT}/coverage/cpu_gpu_merged.dat"
          cp cpu_gpu/cpu_gpu_coverage.log cpu_gpu_coverage.log

      # Merge at the report level.  --dat is repeatable; paths are normalised to repo-relative, so
      # the two inputs need not come from the same checkout path.  A module whose point sets
      # disagree between inputs is listed in the report's consistency section (and, for
      # rtl/cpu|mem|gpu, fails the gate below).
      - name: Combined per-module report (all six RTL trees)
        run: |
          python3 tools/verif/coverage_report.py \
            --dat "${SOC_COV_ROOT}/coverage/merged.dat" \
            --dat "${CPU_COV_ROOT}/coverage/cpu_gpu_merged.dat" \
            --waivers tools/verif/coverage_waivers.txt \
            --out-md "${CPU_COV_ROOT}/coverage/combined_report.md" \
            --out-json "${CPU_COV_ROOT}/coverage/combined_report.json"

      # Beads s1cg + a5ze: the gate.  NOT continue-on-error.  Evaluated on the COMBINED data (both
      # .dat inputs, produced by this workflow at one commit with one Verilator): the triaged trees get
      # the line + control-toggle floors, rtl/cpu|mem|gpu the line floor (the tool's default
      # --line-gate-trees).  Writes gate_report.{md,json} next to the SoC report (uploaded below).
      # Exit 1 = a module is under a floor or its inputs disagree, exit 2 = the gate could not be
      # evaluated (e.g. a line-gated tree was not measured); both fail the job.
      - name: Coverage gate (triaged trees + line floor on cpu/mem/gpu)
        run: |
          set +e
          python3 tools/verif/coverage_report.py \
            --dat "${SOC_COV_ROOT}/coverage/merged.dat" \
            --dat "${CPU_COV_ROOT}/coverage/cpu_gpu_merged.dat" \
            --waivers tools/verif/coverage_waivers.txt \
            --gate --toggle-ratchet tools/verif/coverage_toggle_ratchet.txt \
            --out-md "${SOC_COV_ROOT}/coverage/gate_report.md" \
            --out-json "${SOC_COV_ROOT}/coverage/gate_report.json"
          rc=$?
          set -e
          if [ -s "${SOC_COV_ROOT}/coverage/gate_report.md" ]; then
            {
              printf '## Coverage gate\n\n'
              awk '/^## Gate$/{f=1;next} /^## /{f=0} f' "${SOC_COV_ROOT}/coverage/gate_report.md"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit "${rc}"

      - name: Publish coverage table to the job summary
        if: always()
        run: |
          report="${SOC_COV_ROOT}/coverage/coverage_report.md"
          if [ -s "${report}" ]; then
            cat "${report}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "No coverage report was produced (see the run log)." >> "${GITHUB_STEP_SUMMARY}"
          fi
          combined="${CPU_COV_ROOT}/coverage/combined_report.md"
          if [ -s "${combined}" ]; then
            printf '\n---\n\n## Combined (SoC + CPU/cache/GPU suites)\n\n' >> "${GITHUB_STEP_SUMMARY}"
            cat "${combined}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "No combined report was produced (the CPU/GPU half failed or was skipped: the gate is red)." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload coverage data and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soc-coverage
          path: |
            ${{ env.SOC_COV_ROOT }}/coverage/merged.dat
            ${{ env.SOC_COV_ROOT }}/coverage/coverage_report.md
            ${{ env.SOC_COV_ROOT }}/coverage/coverage_report.json
            ${{ env.SOC_COV_ROOT }}/coverage/gate_report.md
            ${{ env.SOC_COV_ROOT }}/coverage/gate_report.json
            soc_coverage.log
          if-no-files-found: warn
          retention-days: 30

      # Separate artifact: the soc-coverage one above keeps exactly its previous contents.
      - name: Upload combined coverage data and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl-combined-coverage
          path: |
            ${{ env.CPU_COV_ROOT }}/coverage/cpu_gpu_merged.dat
            ${{ env.CPU_COV_ROOT }}/coverage/combined_report.md
            ${{ env.CPU_COV_ROOT }}/coverage/combined_report.json
            cpu_gpu_coverage.log
          if-no-files-found: warn
          retention-days: 30
