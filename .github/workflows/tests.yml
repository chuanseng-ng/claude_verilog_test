name: Tests

on:
  push:
    branches: [ "main" ]
    paths:
      - 'tb/**/*.py'
      - 'tools/cdc/**'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'tb/**/*.py'
      - 'tools/cdc/**'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Install from requirements.txt rather than a hardcoded package list.
      # The list here had drifted out of sync with the declared dependencies:
      # tb/tests/test_cdc_gate.py needs PyYAML (tools/cdc/cdc_gate.py reads a
      # YAML config), which was declared in requirements.txt but never reached
      # this job. Using the single source of truth stops that recurring.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest tb/tests/ -v --tb=short
