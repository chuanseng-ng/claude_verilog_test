name: Cocotb Regression

# Runs the cocotb regressions in CI: the SoC regression (soc_all_ci, sharded) and the CPU phase2_all.
# Two more jobs run the sv2v portability gate and the build-directory key self-tests.
# Doc: um:flow:ci-cocotb, cr:flow:ci-cocotb

# The SoC regression is a matrix job (soc_shard, NSHARDS legs) plus an aggregate gate (soc_all).
# SOC_CI_SUITES in tb/cocotb/soc/Makefile is the one list of suites. soc_coverage.yml shares it.
# `make soc_ci_shard SHARD=k NSHARDS=n` runs one balanced slice. tools/verif/soc_shards.py plans it
# from the uninstrumented per-suite times in tools/verif/soc_shard_weights_plain.json.

# The aggregate job fails unless the suites that ran are exactly SOC_CI_SUITES, the summed pass
# count reaches PASS_FLOOR and no leg logged a failure. It runs `if: always()`, so a red or
# cancelled leg cannot leave the check green or grey. Each leg restores ccache. Only main saves it.

# Tool sourcing mirrors random_tests.yml: Verilator comes from the repo flake (pinned 5.048, the
# version the RTL is known to elaborate under). cocotb runs on the setup-python interpreter, not on nix.
# Do not change this to the Verilator of apt. The pin is part of the contract, as the yosys pin is
# in the CDC job of rtl-checks.yml.

on:
  push:
    branches: [ "main" ]
    paths:
      - 'rtl/**'
      - 'tb/cocotb/**'
      - 'sim/Makefile'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/cocotb.yml'
      - 'tools/verif/soc_shards.py'
      - 'tools/verif/soc_shard_weights_plain.json'
      - 'tb/tests/test_soc_shards.py'
      - 'tools/verif/functional_coverage_report.py'
      - 'tools/verif/functional_coverage_gates.txt'
      - 'tools/verif/functional_coverage_waivers.txt'
      - 'tb/tests/test_functional_coverage_report.py'
      - 'requirements.txt'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'rtl/**'
      - 'tb/cocotb/**'
      - 'sim/Makefile'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/cocotb.yml'
      - 'tools/verif/soc_shards.py'
      - 'tools/verif/soc_shard_weights_plain.json'
      - 'tb/tests/test_soc_shards.py'
      - 'tools/verif/functional_coverage_report.py'
      - 'tools/verif/functional_coverage_gates.txt'
      - 'tools/verif/functional_coverage_waivers.txt'
      - 'tb/tests/test_functional_coverage_report.py'
      - 'requirements.txt'
  workflow_dispatch:

# A second push to the same branch supersedes an in-flight run — the regression
# is the long pole in CI and there is no value in finishing a stale one.
concurrency:
  group: cocotb-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this job only reads the repo. It runs `make -C tb/cocotb/soc
# soc_all`, i.e. repository-controlled Makefile and Python, so the default
# read-write GITHUB_TOKEN on a push to main would be handed to that code for no
# reason. Same posture as rtl-checks.yml's CDC job.
permissions:
  contents: read

env:
  # Number of soc_shard matrix legs. It must equal the length of the matrix list below:
  # every leg asserts it (strategy.job-total) and the aggregate job asserts it against the shard
  # artifacts it received.
  NSHARDS: '4'

jobs:
  # Aggregate gate. This job keeps the id and the name of the old single job, so the check
  # "cocotb soc_all (SoC regression)" still exists and still means "the whole SoC regression is green".
  # The regression runs in the `soc_shard` matrix below. This job runs `if: always()` after the shards,
  # so a red or cancelled shard turns it red (a skipped required check counts as passing).
  soc_all:
    name: cocotb soc_all (SoC regression)
    needs: [soc_shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Every shard succeeded
        run: |
          echo "soc_shard: ${{ needs.soc_shard.result }}"
          if [ "${{ needs.soc_shard.result }}" != "success" ]; then
            echo "FAIL: a soc_shard leg did not succeed (see its log); the regression is not green."
            exit 1
          fi

      # persist-credentials: false — do not leave the token in .git/config.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cocotb-soc-shard-*
          path: shards

      # This step adds a check on top of the exit code of make. A tool that exits 0 with an empty
      # report must never read as PASS. The step checks the logs, not results.xml. The SoC regression
      # runs many suites through one target and each suite overwrites results.xml, so the file on
      # disk describes only the last suite. Its failures are child elements and it has no tests= or
      # failures= attributes, so a count of attributes gives zero.

      # A cocotb make target can exit 0 with failed tests. The log grep is the only CI check that
      # catches a red suite (the failure count and PASS_FLOOR). Do not replace it with the exit code.
      # PASS_FLOOR also guards against a regression that collapses to a few suites while make still exits 0.

      # Set PASS_FLOOR just under the pass count of soc_all_ci, so that a dropped suite trips it. Raise it on
      # purpose when you add suites. When you measure the count, count every passing test of the whole log
      # (the `cocotb.regression ... passed` lines that the grep below counts). Do not read one TESTS= summary
      # line: a truncated run once gave a plausible count and hid a dropped suite.

      # The floor covers soc_all_ci, the union of the shards. The gpio_driver suite is in soc_all but not in
      # soc_all_ci: it needs sw/bench/build/*.hex from the riscv32 cross toolchain, which this job does
      # not install. l2_bench is in neither, because it is a benchmark harness. See tb/cocotb/soc/Makefile.

      # Each shard logs only its own slice, so no shard can hold the floor. This step sums the pass counts
      # of all shard logs and applies PASS_FLOOR to the sum. It also checks that the shards ran exactly the
      # suites of SOC_CI_SUITES: none lost, none run twice, none unknown (tools/verif/soc_shards.py union).
      - name: Verify regression actually ran
        if: always() && needs.soc_shard.result == 'success'
        env:
          # The step fails when the summed pass count of the shards is below PASS_FLOOR. soc_coverage.yml holds
          # the same value. Change it when a pull request adds or removes tests. The derivation of the
          # current value is in the book. Doc: cr:flow:ci-cocotb
          PASS_FLOOR: '896'
        run: |
          set -o pipefail
          n=$(find shards -mindepth 1 -maxdepth 1 -type d -name 'cocotb-soc-shard-*' | wc -l)
          echo "shard artifacts: ${n} (NSHARDS=${NSHARDS})"
          if [ "${n}" -ne "${NSHARDS}" ]; then
            echo "FAIL: expected ${NSHARDS} shard artifacts, got ${n}."
            exit 1
          fi
          for d in shards/cocotb-soc-shard-*; do
            for f in suites_ran.txt cocotb_soc_shard.log; do
              test -s "${d}/${f}" || { echo "FAIL: ${d}/${f} is missing or empty - the regression did not run."; exit 1; }
            done
          done
          {
            printf '## Sharded SoC regression\n\n'
            printf '| shard | suites run | tests passed | tests failed |\n|---:|---:|---:|---:|\n'
            for d in shards/cocotb-soc-shard-*; do
              p=$(grep -cE 'cocotb\.regression .* passed$' "${d}/cocotb_soc_shard.log" || true)
              f=$(grep -cE 'cocotb\.regression .* (failed|FAILED)$' "${d}/cocotb_soc_shard.log" || true)
              printf '| %s | %s | %s | %s |\n' "$(basename "${d}")" "$(wc -l < "${d}/suites_ran.txt")" "${p}" "${f}"
            done
            printf '\n'
          } >> "${GITHUB_STEP_SUMMARY}"
          python3 tools/verif/soc_shards.py union shards/cocotb-soc-shard-*/suites_ran.txt | tee union.txt
          cat union.txt >> "${GITHUB_STEP_SUMMARY}"
          cat shards/cocotb-soc-shard-*/cocotb_soc_shard.log > cocotb_soc.log
          passed=$(grep -cE 'cocotb\.regression .* passed$' cocotb_soc.log || true)
          failed=$(grep -cE 'cocotb\.regression .* (failed|FAILED)$' cocotb_soc.log || true)
          echo "cocotb: ${passed} passed, ${failed} failed (floor ${PASS_FLOOR}), summed over ${n} shards"
          echo "cocotb summed over ${n} shards: ${passed} passed, ${failed} failed (floor ${PASS_FLOOR})" >> "${GITHUB_STEP_SUMMARY}"
          if [ "${failed}" -ne 0 ]; then
            echo "FAIL: ${failed} test(s) reported failed."
            grep -E 'cocotb\.regression .* (failed|FAILED)$' cocotb_soc.log | head -40
            exit 1
          fi
          if [ "${passed}" -lt "${PASS_FLOOR}" ]; then
            echo "FAIL: only ${passed} tests passed, expected >= ${PASS_FLOOR}."
            echo "A suite likely failed to elaborate and was skipped while make still exited 0."
            exit 1
          fi

      # Functional (covergroup) coverage. Every shard exports one YAML per simulator process (FUNC_COV_DIR).
      # This step merges them and gates the groups listed in functional_coverage_gates.txt
      # (floor, min_bins, stale waivers). It needs only PyYAML: the script does not import
      # cocotb-coverage. A group with no data is an error, not a pass.
      - name: Functional coverage gate
        run: |
          python3 -m pip install pyyaml
          mkdir -p func_cov_report
          set +e
          python3 tools/verif/functional_coverage_report.py \
            --in shards \
            --waivers tools/verif/functional_coverage_waivers.txt \
            --gates tools/verif/functional_coverage_gates.txt \
            --out-md func_cov_report/functional_coverage.md \
            --out-json func_cov_report/functional_coverage.json \
            --out-yaml func_cov_report/functional_coverage_merged.yml \
            --gate
          rc=$?
          set -e
          if [ -s func_cov_report/functional_coverage.md ]; then
            cat func_cov_report/functional_coverage.md >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit "${rc}"

      - name: Upload functional coverage report
        if: always() && needs.soc_shard.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: functional-coverage
          path: func_cov_report
          if-no-files-found: warn
          retention-days: 30

      - name: Upload combined cocotb log
        if: always() && needs.soc_shard.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cocotb-soc-results
          path: |
            cocotb_soc.log
            union.txt
          if-no-files-found: warn

  # The SoC regression, split over NSHARDS runners. `soc_all_ci` is a flat list of independent sub-makes
  # (SOC_CI_SUITES in tb/cocotb/soc/Makefile). `make soc_ci_shard SHARD=k NSHARDS=n` runs a balanced slice
  # of it. tools/verif/soc_shards.py plans the slice from tools/verif/soc_shard_weights_plain.json
  # (uninstrumented per-suite times; the coverage workflow uses the instrumented file).
  # The aggregate job `soc_all` above sums the legs. soc_coverage.yml has the same structure.
  soc_shard:
    name: cocotb soc_all shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # A shard is ~1/4 of the ~35 min serial run (the longest unit, one soc_uart_boot slice, is ~5 min);
    # allow generous headroom but still fail rather than burn the 6 h default.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Matrix size matches NSHARDS
        run: |
          if [ "${{ strategy.job-total }}" != "${NSHARDS}" ]; then
            echo "FAIL: the matrix has ${{ strategy.job-total }} legs but NSHARDS=${NSHARDS}; fix one of them."
            exit 1
          fi

      # persist-credentials: false — do not leave the token in .git/config where
      # the regression's own code could read it.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Nix (pinned Verilator from binary cache)
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Install pinned Verilator (nix profile, system-shell compile)
        run: |
          nix profile install .#verilator
          verilator --version

      # cocotb runs on the setup-python interpreter, not on nix. sim/Makefile's
      # NIX_COMPAT_DIR loop symlinks these system libs (resolved via ldconfig)
      # so the Verilator sim binary can dlopen libpython/ctypes.
      # ccache is installed from apt, not nix: it wraps the SYSTEM g++ that sim/cxx_shim.sh calls
      # (see the shim), like the apt line in random_tests.yml.
      - name: Install runtime libs for cocotb
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi8 zlib1g libexpat1 libbz2-1.0 liblzma5 ccache

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'cocotb>=1.8.0,<2.0' cocotb-bus cocotbext-axi 'pyuvm>=3.0.0,<3.1' pytest pytest-cov 'cocotb-coverage==1.2.0' pyyaml
          pip list

      # Static gate: every rtl/periph and rtl/npu module must appear in all five build source lists.
      # sv2v blackboxes a module that a PD list lacks. The flow then completes with a wrong netlist and no
      # cocotb suite can detect it. This step needs no nix shell and no Verilator, so it runs first.
      # check_source_closure.py checks a different property (a list closes over its own `import pkg::*`)
      # and passes when a module is absent from a list entirely.
      - name: Check peripheral file-list membership
        run: python3 tools/verif/check_periph_filelists.py

      # The sv2v / Verilog-2005 portability gate does not run here. It shares nothing with the regression,
      # so it is the job `sv2v_portability` and runs on a second runner in parallel.

      # The shard planner and the Makefile list it reads, including the tests that expand
      # `soc_all_ci` / `soc_ci_shard` with make (they need Verilator and cocotb, which this job has).
      # Cheap, and it fails before the expensive part if the plan and the Makefile disagree.
      - name: Unit-test the shard planner and the SOC_CI_SUITES refactor
        run: python3 -m pytest tb/tests/test_soc_shards.py -q


      # soc_all_ci is the CI-runnable regression: every suite that needs nothing beyond this repo and
      # the nix sim devshell. It builds its own source list. Use soc_all_ci here, not soc_all. soc_all also
      # runs suites that need sw/bench/build/*.hex from the riscv32-none-elf cross toolchain (gpio_driver).
      # This job installs no cross toolchain, so those suites fail in _parse_hex() with FileNotFoundError.
      # Run soc_all locally before you push.

      # The aggregate job keeps the name soc_all: the check "cocotb soc_all (SoC regression)" may be a
      # required status check in branch protection, and a rename would make it unsatisfiable.
      # See the rationale of the split on the soc_all target in tb/cocotb/soc/Makefile.

      # No `|| true` and no `continue-on-error`: this is a gate. Use pipefail: without it tee masks the
      # exit status of make and the gate passes on a failing regression.

      # Compiler cache for the Verilated model. Within a run, the five Verilator runtime objects and the
      # verilator.o of cocotb are byte-identical in every build, so only the first build compiles them.
      # Across runs, an unchanged model (Vtop__ALL.o) is a cache hit.

      # Correctness does not depend on the key below. ccache hashes the preprocessed source, the exact
      # compiler command line (after sim/cxx_shim.sh strips its clang-only flags) and the content of the
      # g++ binary (CCACHE_COMPILERCHECK=content, set by the shim). The key only decides which stale entries
      # are offered. A stale entry is a miss, never a wrong object. Only pushes to main save the cache, so
      # PR runs read the cache of main without filling the repository cache.
      - name: Compiler identity (cache key input)
        id: cc
        run: echo "gcc=$(g++ -dumpfullversion)" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        id: ccache_restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          # One cache per shard (a shard compiles a fixed subset of the models).  The restore-keys end
          # in the generic prefix on purpose: the very first runs find only the old single-job cache
          # (a superset of any shard's models), which is still a valid and warm starting point.
          key: ccache-soc-${{ runner.os }}-gcc${{ steps.cc.outputs.gcc }}-${{ hashFiles('flake.lock') }}-shard${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            ccache-soc-${{ runner.os }}-gcc${{ steps.cc.outputs.gcc }}-${{ hashFiles('flake.lock') }}-shard${{ matrix.shard }}-
            ccache-soc-${{ runner.os }}-gcc${{ steps.cc.outputs.gcc }}-${{ hashFiles('flake.lock') }}-
            ccache-soc-${{ runner.os }}-gcc${{ steps.cc.outputs.gcc }}-

      # Use pipefail so tee cannot mask the exit status of make. No `|| true`: a failing suite fails this leg.
      # SIM_PYTHON3 must be the interpreter cocotb runs on. /usr/bin/python3 dies with "No module named 'encodings'".
      # SIM_BUILD_JOBS sets the parallel C++ compile of each Verilated model. It is not part of the build-directory key.
      # SOC_SUITES_RAN is the manifest of suites that ran to completion. The aggregate job compares it with SOC_CI_SUITES.
      - name: Run this shard's suites
        env:
          # Uninstrumented cost model (soc_coverage.yml uses the instrumented default).  Step-level
          # on purpose: the planner unit tests run in this job too and must see the default.
          SOC_SHARD_WEIGHTS: tools/verif/soc_shard_weights_plain.json
          SIM_CCACHE: '1'
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 400M
          # Paths inside the build tree are absolute; with no -g in the flags ccache does not hash
          # the working directory, and BASEDIR makes the workspace prefix irrelevant anyway.
          CCACHE_BASEDIR: ${{ github.workspace }}
          # Each simulator process writes its functional-coverage YAML here
          # (tb/cocotb/soc/func_cov.py); the aggregate job merges and gates every shard's files.
          FUNC_COV_DIR: ${{ github.workspace }}/func_cov
        run: |
          set -o pipefail
          ccache --zero-stats
          echo "SIM_PYTHON3=$(command -v python3) ($(python3 -V))"
          python3 tools/verif/soc_shards.py --weights "${SOC_SHARD_WEIGHTS}" plan --nshards "${NSHARDS}"
          echo "::group::make -C tb/cocotb/soc soc_ci_shard SHARD=${{ matrix.shard }} NSHARDS=${NSHARDS}"
          make -C tb/cocotb/soc soc_ci_shard \
            SHARD=${{ matrix.shard }} NSHARDS="${NSHARDS}" \
            SOC_SHARD_WEIGHTS="${GITHUB_WORKSPACE}/${SOC_SHARD_WEIGHTS}" \
            SOC_SUITES_RAN="${GITHUB_WORKSPACE}/suites_ran.txt" \
            SIM_PYTHON3="$(command -v python3)" \
            SIM_BUILD_JOBS="$(nproc)" 2>&1 | tee cocotb_soc_shard.log
          echo "::endgroup::"
          echo "::group::ccache statistics"
          ccache --show-stats | tee ccache_stats.txt
          echo "::endgroup::"

      # Per-shard version of the aggregate job's log check (a fast, local failure).  The FLOOR is
      # applied by the aggregate job to the SUMMED count: a shard legitimately holds only a fraction
      # of the tests, so no per-shard floor exists.
      - name: Check this shard's regression
        run: |
          if [ ! -s cocotb_soc_shard.log ]; then
            echo "FAIL: no log produced - the shard did not run."
            exit 1
          fi
          passed=$(grep -cE 'cocotb\.regression .* passed$' cocotb_soc_shard.log || true)
          failed=$(grep -cE 'cocotb\.regression .* (failed|FAILED)$' cocotb_soc_shard.log || true)
          echo "shard ${{ matrix.shard }}: ${passed} passed, ${failed} failed"
          if [ "${failed}" -ne 0 ]; then
            echo "FAIL: ${failed} test(s) reported failed."
            grep -E 'cocotb\.regression .* (failed|FAILED)$' cocotb_soc_shard.log | head -40
            exit 1
          fi
          if [ "${passed}" -lt 1 ]; then
            echo "FAIL: no passing test in this shard's log."
            exit 1
          fi
          test -s suites_ran.txt || { echo "FAIL: suites_ran.txt is missing or empty."; exit 1; }
          echo "suites run by this shard:"; cat suites_ran.txt

      - name: Save ccache
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-soc-${{ runner.os }}-gcc${{ steps.cc.outputs.gcc }}-${{ hashFiles('flake.lock') }}-shard${{ matrix.shard }}-${{ github.sha }}

      - name: Upload shard log and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocotb-soc-shard-${{ matrix.shard }}
          path: |
            cocotb_soc_shard.log
            suites_ran.txt
            ccache_stats.txt
            func_cov
          if-no-files-found: warn
          retention-days: 7

  cpu_phase2_all:
    name: cocotb phase2_all (CPU standalone regression)
    runs-on: ubuntu-latest
    # 7 sub-suites, 112 tests, ~8s of simulated time / well under a minute of
    # wall time locally (single Verilator build reused via sim_build's normal
    # incremental compile — VERILOG_SOURCES is identical across all 7
    # sub-targets). Generous headroom for a colder CI runner.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Nix (pinned Verilator from binary cache)
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Install pinned Verilator (nix profile, system-shell compile)
        run: |
          nix profile install .#verilator
          verilator --version

      # Same rationale as soc_all's step above: the Vtop binary dlopen's the
      # setup-python interpreter's libpython, which needs these system libs.
      # tb/cocotb/cpu/Makefile's own USE_VERILATOR_EXTRALIBS=1 opt-in
      # symlinks them into place rather than relying on sim/Makefile's
      # NIX_COMPAT_DIR loop (this Makefile doesn't have that loop).
      - name: Install runtime libs for cocotb
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi8 zlib1g libexpat1 libbz2-1.0 liblzma5

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'cocotb>=1.8.0,<2.0' cocotb-bus cocotbext-axi 'pyuvm>=3.0.0,<3.1' pytest pytest-cov
          pip list

      # phase2_all chains 7 `$(MAKE)` sub-invocations (smoke_uvm, isa_uvm,
      # pipeline_hazards, interrupts, debug, axi_protocol, fault_injection)
      # and its own recipe already tallies ✓/✗ per suite and exits non-zero
      # on any failure — no `|| true` here either.
      - name: Run phase2_all
        env:
          USE_VERILATOR_EXTRALIBS: '1'
        run: |
          set -o pipefail
          echo "::group::make -C tb/cocotb/cpu phase2_all"
          echo "SIM_PYTHON3=$(command -v python3) ($(python3 -V))"
          make -C tb/cocotb/cpu phase2_all SIM_PYTHON3="$(command -v python3)" 2>&1 | tee cocotb_cpu.log
          echo "::endgroup::"

      # Same rationale as the log check of soc_all: do not trust a bare exit code, and do not trust results.xml
      # (the sub-targets of phase2_all each overwrite it in turn). Set the floor just under the pass count of
      # the 7 suites: smoke_uvm, isa_uvm, pipeline_hazards, interrupts, debug, axi_protocol, fault_injection.
      - name: Verify regression actually ran
        if: always()
        env:
          PASS_FLOOR: '100'
        run: |
          if [ ! -s cocotb_cpu.log ]; then
            echo "FAIL: no cocotb log produced — the regression did not run."
            exit 1
          fi
          passed=$(grep -cE 'cocotb\.regression .* passed$' cocotb_cpu.log || true)
          failed=$(grep -cE 'cocotb\.regression .* (failed|FAILED)$' cocotb_cpu.log || true)
          echo "cocotb: ${passed} passed, ${failed} failed (floor ${PASS_FLOOR})"
          if [ "${failed}" -ne 0 ]; then
            echo "FAIL: ${failed} test(s) reported failed."
            grep -E 'cocotb\.regression .* (failed|FAILED)$' cocotb_cpu.log | head -40
            exit 1
          fi
          if [ "${passed}" -lt "${PASS_FLOOR}" ]; then
            echo "FAIL: only ${passed} tests passed, expected >= ${PASS_FLOOR}."
            echo "A suite likely failed to elaborate and was skipped while make still exited 0."
            exit 1
          fi

      - name: Upload cocotb results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocotb-cpu-results
          path: |
            cocotb_cpu.log
            tb/cocotb/cpu/results.xml
          if-no-files-found: warn

  # Verilog-2005 portability gate (sv2v + yosys parse). It shares nothing with the regression (no simulator,
  # no cocotb), so it runs on its own runner and overlaps the regression.
  # It adds a new check, "sv2v / Verilog-2005 portability gate". It renames no existing check. If branch
  # protection lists required checks, add it there so that the gate stays blocking.

  # The cocotb regression cannot see this class: Verilator reads the SystemVerilog directly and never sees
  # the sv2v output, so the suite can be green while the design is unsynthesisable. Both PD flows use sv2v.
  # Negative control: if you reintroduce the PWM construct that once broke CI, the gate exits 2.
  sv2v_portability:
    name: sv2v / Verilog-2005 portability gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: sv2v / Verilog-2005 portability gate
        run: nix develop --command make -C sim sv2v-parse

  # Self-tests for the content-keyed Verilator build directories. They prove that the directory sharing of
  # the soc_all job cannot turn into a stale-binary false pass. A changed define, -G parameter or tool
  # version must change the directory. A touched RTL file must regenerate the model. A failing suite in a
  # shared directory must still fail the run. This is a separate job, so it overlaps the regression.
  sim_build_key:
    name: cocotb build-directory key self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Nix (pinned Verilator from binary cache)
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Install pinned Verilator (nix profile, system-shell compile)
        run: |
          nix profile install .#verilator
          verilator --version

      - name: Install runtime libs for cocotb
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi8 zlib1g libexpat1 libbz2-1.0 liblzma5

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'cocotb>=1.8.0,<2.0' cocotb-bus cocotbext-axi 'pyuvm>=3.0.0,<3.1' pytest pytest-cov

      - name: Build-directory key unit tests
        run: SIM_PYTHON3="$(command -v python3)" pytest tb/tests/test_sim_build_key.py -v

      # Negative control (c): a failing suite that reuses another suite's build directory.
      - name: Shared-build failure propagation
        run: make -C tb/cocotb/soc check-shared-build-failure SIM_PYTHON3="$(command -v python3)"
