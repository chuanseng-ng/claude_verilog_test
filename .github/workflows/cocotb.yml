name: Cocotb Regression

# Runs the maintained cocotb regression (tb/cocotb/soc soc_all) in CI.
#
# WHY THIS EXISTS (bead claude_verilog_test-50t): before this workflow, CI ran
# only `make -C sim {lint,format,cdc}`. No cocotb suite was executed anywhere,
# so a testbench could stop *compiling* while every CI gate stayed green. That
# is not hypothetical: the whole of tb/cocotb/cpu was failing elaboration with
# "Import package not found: 'axi_pkg'" since the M2 AXI4 burst upgrade moved
# the CPU onto axi_pkg types without updating that Makefile's VERILOG_SOURCES,
# and nobody noticed because lint does assemble the right file list and
# therefore passed throughout. Fixed 2026-08-11 (VERILOG_SOURCES now closes
# over axi_pkg/soc_addr_map_pkg + the EX1b/EX1c/EX2 retiming split — see
# tools/verif/check_source_closure.py, which verifies this class of gap
# statically without needing a simulator). Both jobs below now run in CI so
# neither list can silently rot again.
#
# Tool sourcing mirrors random_tests.yml deliberately: Verilator comes from the
# repo flake (pinned 5.048 — the version the RTL is known to elaborate under),
# while cocotb runs on the setup-python interpreter, not on nix. Do not "simplify"
# this to apt's verilator; the pin is part of the contract, same rationale as the
# yosys pin in rtl-checks.yml's CDC job.

on:
  push:
    branches: [ "main" ]
    paths:
      - 'rtl/**'
      - 'tb/cocotb/**'
      - 'sim/Makefile'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/cocotb.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'rtl/**'
      - 'tb/cocotb/**'
      - 'sim/Makefile'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/cocotb.yml'
  workflow_dispatch:

# A second push to the same branch supersedes an in-flight run — the regression
# is the long pole in CI and there is no value in finishing a stale one.
concurrency:
  group: cocotb-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this job only reads the repo. It runs `make -C tb/cocotb/soc
# soc_all`, i.e. repository-controlled Makefile and Python, so the default
# read-write GITHUB_TOKEN on a push to main would be handed to that code for no
# reason. Same posture as rtl-checks.yml's CDC job.
permissions:
  contents: read

jobs:
  soc_all:
    name: cocotb soc_all (SoC regression)
    runs-on: ubuntu-latest
    # Measured ~15-25 min locally on a 16-core host; CI runners are smaller, so
    # allow generous headroom but still fail rather than burn the 6 h default.
    timeout-minutes: 120

    steps:
      # persist-credentials: false — do not leave the token in .git/config where
      # the regression's own code could read it.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Nix (pinned Verilator from binary cache)
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Install pinned Verilator (nix profile, system-shell compile)
        run: |
          nix profile install .#verilator
          verilator --version

      # cocotb runs on the setup-python interpreter, not on nix. sim/Makefile's
      # NIX_COMPAT_DIR loop symlinks these system libs (resolved via ldconfig)
      # so the Verilator sim binary can dlopen libpython/ctypes.
      - name: Install runtime libs for cocotb
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi8 zlib1g libexpat1 libbz2-1.0 liblzma5

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'cocotb>=1.8.0,<2.0' cocotb-bus cocotbext-axi 'pyuvm>=3.0.0,<3.1' pytest pytest-cov
          pip list

      # Static, dependency-free gate: every rtl/periph and rtl/npu module must
      # appear in all five build source lists. This exists because a module
      # missing from a *PD* list is silently BLACKBOXED by sv2v -- the flow
      # completes with a wrong netlist and no cocotb suite below can detect it,
      # since cocotb never runs the PD flow. Needs no nix shell and no Verilator,
      # so it runs before the expensive regression and fails fast.
      # Complements check_source_closure.py, which checks a different property
      # (does a list close over its own `import pkg::*`), and which passes
      # happily when a module is absent from a list entirely.
      - name: Check peripheral file-list membership
        run: python3 tools/verif/check_periph_filelists.py

      # soc_all_ci is the CI-runnable regression: every suite that needs nothing
      # beyond this repo + the nix sim devshell. It builds its own source list, so
      # it is unaffected by the tb/cocotb/cpu breakage above.
      #
      # It is soc_all_ci and NOT soc_all on purpose. soc_all additionally runs
      # suites that need the riscv32-none-elf cross toolchain to have produced
      # sw/bench/build/*.hex (currently gpio_driver); this job installs no cross
      # toolchain, so those suites die in _parse_hex() with FileNotFoundError --
      # which is what failed on PR #195. soc_all remains the full local gate and
      # should be run before pushing. See the split's rationale on the soc_all
      # target in tb/cocotb/soc/Makefile.
      #
      # The step and job NAMES still say soc_all deliberately: the check name
      # "cocotb soc_all (SoC regression)" may be a required status check in branch
      # protection, and renaming it would make that requirement unsatisfiable.
      # No `|| true` and no `continue-on-error`: this is a gate.
      # pipefail matters: without it the tee would mask make's exit status and
      # the gate would pass on a failing regression.
      - name: Run soc_all
        run: |
          set -o pipefail
          echo "::group::make -C tb/cocotb/soc soc_all_ci"
          # SIM_PYTHON3 must be the SAME interpreter cocotb runs on. The Makefile
          # defaults to /usr/bin/python3, which is right locally but wrong here:
          # setup-python puts a hostedtoolcache interpreter on PATH and points
          # PYTHONHOME/LD_LIBRARY_PATH at it, while /usr/bin/python3 is Ubuntu's
          # own. Verilator's verilator_includer then loads a mismatched stdlib and
          # dies with "ModuleNotFoundError: No module named 'encodings'".
          echo "SIM_PYTHON3=$(command -v python3) ($(python3 -V))"
          make -C tb/cocotb/soc soc_all_ci SIM_PYTHON3="$(command -v python3)" 2>&1 | tee cocotb_soc.log
          echo "::endgroup::"

      # Belt-and-braces on top of make's exit code, same rationale as bead dwp
      # (a tool that exits 0 with an empty report must never read as PASS).
      #
      # This checks the LOG, not results.xml, deliberately. soc_all runs 21
      # suites through the same target and each overwrites the previous
      # results.xml, so the XML on disk at the end describes only the last
      # suite — it cannot witness the whole regression. (Its schema is also
      # <testsuites>/<testsuite>/<testcase> with failures as child ELEMENTS and
      # no tests=/failures= attributes, so attribute-based counting silently
      # yields zero.)
      #
      # PASS_FLOOR guards the "regression collapsed to a handful of suites"
      # failure mode, where make still exits 0. Measured 303 passing tests on
      # 2026-09-29 (soc_all_ci, after Phase 6a-3 WDT: +22 from its L1 unit suite
      # and +2 from the soc_wdt fabric test, which covers both the RST_EN=0 and
      # RST_EN=1 CPU-domain reset paths); 279 on
      # 2026-09-28 (soc_all_ci, after Phase 6a-2 PWM: +16 from its L1 unit suite
      # and +1 from the soc_pwm fabric test; 262 earlier the same day after the
      # Phase 6 groundwork added the apb_interconnect suite, itself +43 from its
      # N_SLAVES sweep and +1 from test_axil_interconnect's reserved-slot test;
      # 218 over 28 suites on
      # 2026-09-27 after the SoC-level GPIO fabric test `soc_gpio`; 217 over 27
      # suites on 2026-09-20; 178 over 21 suites on 2026-08-07); the floor is
      # set just under that so a dropped suite trips it rather than passing
      # unnoticed. Raise it deliberately as suites are added.
      #
      # NOTE this floor is measured against soc_all_ci, which is what this job
      # runs. The `gpio_driver` suite is in soc_all (the full local gate) but not
      # in soc_all_ci, because it needs sw/bench/build/*.hex from the riscv32
      # cross toolchain that this job does not install. l2_bench is in neither --
      # it is a benchmark harness, not a regression. See tb/cocotb/soc/Makefile.
      - name: Verify regression actually ran
        if: always()
        env:
          PASS_FLOOR: '300'
        run: |
          if [ ! -s cocotb_soc.log ]; then
            echo "FAIL: no cocotb log produced — the regression did not run."
            exit 1
          fi
          passed=$(grep -cE 'cocotb\.regression .* passed$' cocotb_soc.log || true)
          failed=$(grep -cE 'cocotb\.regression .* (failed|FAILED)$' cocotb_soc.log || true)
          echo "cocotb: ${passed} passed, ${failed} failed (floor ${PASS_FLOOR})"
          if [ "${failed}" -ne 0 ]; then
            echo "FAIL: ${failed} test(s) reported failed."
            grep -E 'cocotb\.regression .* (failed|FAILED)$' cocotb_soc.log | head -40
            exit 1
          fi
          if [ "${passed}" -lt "${PASS_FLOOR}" ]; then
            echo "FAIL: only ${passed} tests passed, expected >= ${PASS_FLOOR}."
            echo "A suite likely failed to elaborate and was skipped while make still exited 0."
            exit 1
          fi

      - name: Upload cocotb results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocotb-soc-results
          path: |
            cocotb_soc.log
            tb/cocotb/**/results.xml
          if-no-files-found: warn

  cpu_phase2_all:
    name: cocotb phase2_all (CPU standalone regression)
    runs-on: ubuntu-latest
    # 7 sub-suites, 112 tests, ~8s of simulated time / well under a minute of
    # wall time locally (single Verilator build reused via sim_build's normal
    # incremental compile — VERILOG_SOURCES is identical across all 7
    # sub-targets). Generous headroom for a colder CI runner.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Nix (pinned Verilator from binary cache)
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Install pinned Verilator (nix profile, system-shell compile)
        run: |
          nix profile install .#verilator
          verilator --version

      # Same rationale as soc_all's step above: the Vtop binary dlopen's the
      # setup-python interpreter's libpython, which needs these system libs.
      # tb/cocotb/cpu/Makefile's own USE_VERILATOR_EXTRALIBS=1 opt-in
      # symlinks them into place rather than relying on sim/Makefile's
      # NIX_COMPAT_DIR loop (this Makefile doesn't have that loop).
      - name: Install runtime libs for cocotb
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi8 zlib1g libexpat1 libbz2-1.0 liblzma5

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'cocotb>=1.8.0,<2.0' cocotb-bus cocotbext-axi 'pyuvm>=3.0.0,<3.1' pytest pytest-cov
          pip list

      # phase2_all chains 7 `$(MAKE)` sub-invocations (smoke_uvm, isa_uvm,
      # pipeline_hazards, interrupts, debug, axi_protocol, fault_injection)
      # and its own recipe already tallies ✓/✗ per suite and exits non-zero
      # on any failure — no `|| true` here either.
      - name: Run phase2_all
        env:
          USE_VERILATOR_EXTRALIBS: '1'
        run: |
          set -o pipefail
          echo "::group::make -C tb/cocotb/cpu phase2_all"
          echo "SIM_PYTHON3=$(command -v python3) ($(python3 -V))"
          make -C tb/cocotb/cpu phase2_all SIM_PYTHON3="$(command -v python3)" 2>&1 | tee cocotb_cpu.log
          echo "::endgroup::"

      # Same belt-and-braces rationale as soc_all's equivalent step (bead
      # dwp): don't trust a bare exit code, and don't trust results.xml
      # either (phase2_all's sub-targets each overwrite it in turn).
      # Measured 112 passing tests on 2026-08-11 (7 suites: smoke_uvm 4,
      # isa_uvm 54, pipeline_hazards 16, interrupts 13, debug 6,
      # axi_protocol 12, fault_injection 7). Floor set just under that.
      - name: Verify regression actually ran
        if: always()
        env:
          PASS_FLOOR: '100'
        run: |
          if [ ! -s cocotb_cpu.log ]; then
            echo "FAIL: no cocotb log produced — the regression did not run."
            exit 1
          fi
          passed=$(grep -cE 'cocotb\.regression .* passed$' cocotb_cpu.log || true)
          failed=$(grep -cE 'cocotb\.regression .* (failed|FAILED)$' cocotb_cpu.log || true)
          echo "cocotb: ${passed} passed, ${failed} failed (floor ${PASS_FLOOR})"
          if [ "${failed}" -ne 0 ]; then
            echo "FAIL: ${failed} test(s) reported failed."
            grep -E 'cocotb\.regression .* (failed|FAILED)$' cocotb_cpu.log | head -40
            exit 1
          fi
          if [ "${passed}" -lt "${PASS_FLOOR}" ]; then
            echo "FAIL: only ${passed} tests passed, expected >= ${PASS_FLOOR}."
            echo "A suite likely failed to elaborate and was skipped while make still exited 0."
            exit 1
          fi

      - name: Upload cocotb results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocotb-cpu-results
          path: |
            cocotb_cpu.log
            tb/cocotb/cpu/results.xml
          if-no-files-found: warn
