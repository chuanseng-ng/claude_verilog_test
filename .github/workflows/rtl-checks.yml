name: RTL Checks

# Independent RTL gates, all hard gates:
#   1. Verible style lint. There is deliberately NO format check: see the note in the verible job.
#   2. Static CDC check, cdc_snitch + cdc_gate.
#   3. DFT scan-readiness check (tools/dft/check_scan_clk_rst.py on the flattened Sky130 and ASAP7 SoC netlists,
#      plus its own negative-control pytest suite). It runs inside the `cdc` job, which has the pinned yosys and sv2v.

# Doc: um:flow:ci-rtl-checks, cr:flow:ci-rtl-checks

on:
  push:
    branches: [ "main" ]
    paths:
      - 'rtl/**'
      - '.rules.verible_lint'
      - 'flake.nix'
      - 'sim/Makefile'
      - 'tools/cdc/**'
      # DFT scan-readiness check: the checker, its tests, the Makefile targets that drive it, and the
      # PnR-side stubs and wrappers that sv2v folds into the netlists it reads. Without these, an edit that
      # breaks the check would not run it.
      - 'tools/dft/**'
      - 'tb/tests/test_dft_scan_check.py'
      # PMU registered-outputs structural gate.
      - 'tools/verif/check_registered_outputs.py'
      - 'tb/tests/test_pmu_registered_outputs.py'
      - 'pnr/Makefile'
      - 'pnr/sky130/soc/*.sv'
      - 'pnr/asap7/soc/*.sv'
      - '.github/workflows/rtl-checks.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'rtl/**'
      - '.rules.verible_lint'
      - 'flake.nix'
      - 'sim/Makefile'
      - 'tools/cdc/**'
      # DFT scan-readiness check: the checker, its tests, the Makefile targets that drive it, and the
      # PnR-side stubs and wrappers that sv2v folds into the netlists it reads. Without these, an edit that
      # breaks the check would not run it.
      - 'tools/dft/**'
      - 'tb/tests/test_dft_scan_check.py'
      # PMU registered-outputs structural gate.
      - 'tools/verif/check_registered_outputs.py'
      - 'tb/tests/test_pmu_registered_outputs.py'
      - 'pnr/Makefile'
      - 'pnr/sky130/soc/*.sv'
      - 'pnr/asap7/soc/*.sv'
      - '.github/workflows/rtl-checks.yml'
  workflow_dispatch:

jobs:
  verible:
    name: Verible RTL Lint
    runs-on: ubuntu-latest

    env:
      # Pinned for reproducibility. Bump deliberately, and bump `veribleFor` (version + sha256) in flake.nix
      # in the SAME commit so that `nix develop` and this job keep running the identical binary.
      VERIBLE_VERSION: v0.0-4063-gf831ec18
      VERIBLE_SHA256: 7b8110e0a5bfffae674f976490b5e6411471e410d474ff7fdbe4ae1e4e3381b6

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Verible
        run: |
          echo "::group::Install Verible ${VERIBLE_VERSION}"
          TARBALL="verible-${VERIBLE_VERSION}-linux-static-x86_64.tar.gz"
          URL="https://github.com/chipsalliance/verible/releases/download/${VERIBLE_VERSION}/${TARBALL}"
          mkdir -p /tmp/verible
          curl -sSfL -o "/tmp/${TARBALL}" "$URL"
          echo "${VERIBLE_SHA256}  /tmp/${TARBALL}" | sha256sum -c -
          tar -xzf "/tmp/${TARBALL}" -C /tmp/verible --strip-components=1
          echo "/tmp/verible/bin" >> "$GITHUB_PATH"
          echo "::endgroup::"

      - name: Verible version
        run: verible-verilog-lint --version

      # HARD GATE. The whole tree is lint-clean, so any new finding fails the job. Do NOT re-add
      # `continue-on-error` here; fix the finding, or (for a justified false positive) tune .rules.verible_lint
      # with a reason. Style lint runs against the whole tree (curated, low-noise ruleset).
      - name: Verible style lint
        run: |
          echo "::group::verible-verilog-lint"
          make -C sim lint-verible
          echo "::endgroup::"

      # NO FORMAT CHECK. verible-verilog-format cannot express the hand-aligned house style: most of rtl/**/*.sv
      # fail `--verify`, and the house-style exemplars rtl/periph/timer.sv and gpio_controller.sv fail every variant.
      # An advisory step that always reports differences is noise, and the coding rules forbid style-only mass
      # edits of verified RTL (Doc: um:guide:commit-and-coding-rules), so the step was dropped instead of gated.
      # Re-add a format gate only together with a deliberate, verified, one-off whole-tree reformat.

  # Static clock-domain-crossing gate. A hard gate (no continue-on-error). It is meaningful only because
  # cdc_gate.py post-processes the raw output of cdc_snitch, which is mostly modelling artifacts (every top-level
  # port as its own clock domain, clock-gate outputs separate from their source clock, one "domain" per bus bit).
  # cdc_gate removes those with the design facts that phase5_soc_multiclock.sdc encodes for STA, applies justified
  # waivers, and fails on anything left over or on a stale waiver. See tools/cdc/README.md.
  cdc:
    name: CDC check (cdc_snitch + gate)
    runs-on: ubuntu-latest

    steps:
      # persist-credentials: false — this job downloads and EXECUTES pinned
      # third-party tooling (sv2v, cdc_snitch.py, oss-cad-suite). Do not leave
      # the GitHub token sitting in .git/config where that tooling could read it.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml

      # All three tools (yosys, sv2v, cdc_snitch.py) come from the pinned revisions in tools/cdc/versions.env.
      # The cache keeps a run independent of upstream availability. Its key is versions.env, so a bump invalidates it.
      # Cache the TOOL paths only, never the whole of sim/build/cdc: that directory also holds the generated outputs
      # of the run (soc_top_cdc.txt, soc_top_cdc_gate.json, soc_top.flist). A run that fails before it regenerates
      # them would restore a prior report, and the `if: always()` upload below would publish it as current.
      - name: Cache pinned CDC tools
        uses: actions/cache@v4
        with:
          path: |
            sim/build/cdc/oss-cad-suite
            sim/build/cdc/sv2v-Linux
            sim/build/cdc/cdc_snitch.py
            sim/build/cdc/cdc_snitch_proc.ys
          key: cdc-tools-${{ hashFiles('tools/cdc/versions.env') }}

      # THE YOSYS VERSION IS PART OF THE CONTRACT OF THE GATE. Do not swap it for a distro package. The flatten pass
      # of an older yosys leaves clock domains as instance-local net names (`u_gpu.clk`, `u_apb_dbg_cdc.m_clk_i`).
      # The pinned yosys resolves them to the top-level ports (`clk_i`, `cpu_clk_i`) that the domain_aliases of
      # cdc_config.yml use. Different yosys, different verdict: the pin makes this a gate. The download happens once
      # per versions.env bump because of the cache above. The tarball is pruned to keep the cache small.
      - name: Fetch pinned CDC tools (yosys + sv2v + cdc_snitch)
        run: |
          echo "::group::fetch_cdc_tools.sh --with-yosys"
          bash tools/cdc/fetch_cdc_tools.sh --with-yosys
          rm -f sim/build/cdc/oss-cad-suite.tgz sim/build/cdc/sv2v.zip
          sim/build/cdc/oss-cad-suite/bin/yosys --version
          echo "::endgroup::"

      - name: Run CDC gate
        run: |
          echo "::group::make cdc CDC_STRICT=1"
          make -C sim cdc CDC_STRICT=1
          echo "::endgroup::"

      # DFT scan-readiness gate. HARD GATE, no continue-on-error. It runs on the flattened Sky130 and ASAP7 SoC netlists
      # and in block mode on the flattened CPU-macro netlists of both PDKs. It proves that in scan mode every async
      # reset is tester-controlled, every flop is test-clocked, and the two trst_ni reset synchronisers (u_trst_sync in
      # jtag_tap, u_sw_rst in dft_ctrl) are present and each feeds only its own consumer (--expect-reset-sync).
      # The CDC gate above cannot see this: the opt_merge pass of cdc_snitch folds the two identical chains into one.

      # Tools: the pinned yosys and sv2v of this job go to the Makefile through its YOSYS (`:=`, overridable only on the
      # command line) and SV2V (`?=`) variables. The Makefile defaults (a bare `yosys` on PATH, a /nix/store sv2v) stay,
      # because a developer host uses them. The pinned sv2v here is v0.0.13; the Makefile default is 0.0.13.1.

      # `!cancelled()` so that a failing CDC gate does not hide the verdict of this gate (and the reverse).
      # A failed tool fetch still fails these steps loudly.
      - name: DFT scan-check (Sky130 + ASAP7 SoC netlists)
        if: ${{ !cancelled() }}
        env:
          PINNED_YOSYS: ${{ github.workspace }}/sim/build/cdc/oss-cad-suite/bin/yosys
          PINNED_SV2V: ${{ github.workspace }}/sim/build/cdc/sv2v-Linux/sv2v
        run: |
          for target in dft-scan-check dft-scan-check-asap7 dft-scan-check-cpu-macro dft-scan-check-cpu-macro-asap7; do
            echo "::group::make -C pnr ${target}"
            make -C pnr "${target}" YOSYS="${PINNED_YOSYS}" SV2V="${PINNED_SV2V}"
            echo "::endgroup::"
          done

      # tb/tests/test_dft_scan_check.py skips itself when it cannot find yosys (`pytestmark = skipif(YOSYS is None)`),
      # and a plain pytest run reports that as green. Run with the pinned yosys and fail the step if any test skipped
      # or fewer than the expected number ran: a gate that is green by skipping is the failure this step prevents.
      # EXPECT_TESTS is a floor, not an exact count: raise it in the same commit that adds tests to the file.
      - name: DFT scan-check tests (pinned yosys, must not skip)
        if: ${{ !cancelled() }}
        env:
          YOSYS: ${{ github.workspace }}/sim/build/cdc/oss-cad-suite/bin/yosys
          EXPECT_TESTS: '60'
        run: |
          python3 -m pip install --user pytest
          log="${RUNNER_TEMP}/dft_scan_pytest.log"
          python3 -m pytest tb/tests/test_dft_scan_check.py -v -rs -p no:cacheprovider 2>&1 | tee "${log}"
          if grep -Eq '[0-9]+ skipped|SKIPPED' "${log}"; then
            echo "::error::test_dft_scan_check.py skipped tests; the gate did not run (is YOSYS=${YOSYS} usable?)"
            exit 1
          fi
          passed="$(grep -Eo '[0-9]+ passed' "${log}" | tail -n 1 | grep -Eo '[0-9]+' || true)"
          echo "dft scan-check pytest: ${passed:-0} passed (floor ${EXPECT_TESTS})"
          if [ "${passed:-0}" -lt "${EXPECT_TESTS}" ]; then
            echo "::error::only ${passed:-0} test_dft_scan_check.py tests passed, expected >= ${EXPECT_TESTS}"
            exit 1
          fi

      # PMU registered outputs. The PMU's clk_en/iso_en/rst_n/ret outputs drive
      # cdc_sync D pins, the async clear of u_cpu_pmu_rst_sync and the GPU async reset, so
      # each must be a flop Q (a binary-state decode can glitch, and no zero-delay simulation
      # can show that). The test proves it on the sv2v->yosys netlist and carries one mutation
      # per output. Same no-skip rule as the DFT step: a skipped gate is not a passing gate.
      - name: PMU registered-outputs gate (pinned yosys + sv2v, must not skip)
        if: ${{ !cancelled() }}
        env:
          YOSYS: ${{ github.workspace }}/sim/build/cdc/oss-cad-suite/bin/yosys
          SV2V: ${{ github.workspace }}/sim/build/cdc/sv2v-Linux/sv2v
          EXPECT_TESTS: '12'
        run: |
          python3 -m pip install --user pytest
          log="${RUNNER_TEMP}/pmu_regout_pytest.log"
          python3 -m pytest tb/tests/test_pmu_registered_outputs.py -v -rs -p no:cacheprovider 2>&1 | tee "${log}"
          if grep -Eq '[0-9]+ skipped|SKIPPED' "${log}"; then
            echo "::error::test_pmu_registered_outputs.py skipped tests; the gate did not run"
            exit 1
          fi
          passed="$(grep -Eo '[0-9]+ passed' "${log}" | tail -n 1 | grep -Eo '[0-9]+' || true)"
          echo "pmu registered-outputs pytest: ${passed:-0} passed (floor ${EXPECT_TESTS})"
          if [ "${passed:-0}" -lt "${EXPECT_TESTS}" ]; then
            echo "::error::only ${passed:-0} tests passed, expected >= ${EXPECT_TESTS}"
            exit 1
          fi

      # Keep the raw report and the machine-readable summary even on failure —
      # the gate output names the offending registers, which is what you need
      # to triage without reproducing the run locally.
      - name: Upload CDC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdc-report
          path: |
            sim/build/cdc/soc_top_cdc.txt
            sim/build/cdc/soc_top_cdc_gate.json
          if-no-files-found: warn
