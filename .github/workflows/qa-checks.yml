name: QA Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  qa-checks:
    name: Python QA Checks
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 2, not the default 1: the beads reopen gate below needs HEAD^1.
          fetch-depth: 2

      # Bead 78ld. On a pull_request event HEAD is GitHub's PR merge commit and
      # HEAD^1 is the base-branch tip, so this asks "would merging this PR move a
      # bead closed on main back to open?". That happens when a checkout's
      # `bd import` replayed an older .beads/issues.jsonl into the Dolt DB and the
      # branch's commits then exported the reverted state. Rows the PR never
      # touched are ignored (the merge keeps main's row). Escape hatch for a
      # deliberate reopen: a note containing `beads-reopen-ok`. Stdlib only, so
      # it runs before the dependency install.
      - name: Beads reopen gate (no closed bead reopened by this PR)
        if: github.event_name == 'pull_request' && matrix.python-version == '3.12'
        run: python3 tools/setup/check_beads_reopen.py --base-ref HEAD^1 --head-ref HEAD

      # Bead ainf. BLOCKING, zero allowed sites: no bit/part/element select may be taken directly on
      # a struct member anywhere in rtl/ (read or write) - copy the member to a named signal first.
      # Synlig mis-elaborates that idiom, silently and in a way that depends on the struct TYPE
      # (docs/SYNLIG_STRUCT_SELECT_AINF.md). Source-text scan only, stdlib only, no baseline: the
      # waiver file tools/verif/struct_member_select_baseline.txt must stay empty or this fails.
      # No `continue-on-error` and no `|| true`: this is a gate. tb/tests/test_check_struct_member_select.py
      # runs the same check again under pytest below.
      - name: Struct-member select gate (no select on a struct member in rtl/)
        run: python3 tools/verif/check_struct_member_select.py -v

      # Bead 1as3. BLOCKING: the committed rtl/filelist/*.f are GENERATED from the Makefile source
      # lists (tb/cocotb/soc/Makefile PLL_SOURCES, pnr/Makefile CPU_SV_FILES / GPU_SV_FILES). Editing
      # one of those lists without regenerating (python3 tools/verif/gen_filelist.py) leaves an
      # external tool compiling a stale file set - and sv2v-based tools silently blackbox a module
      # missing from a list. Stdlib only. No `continue-on-error`, no `|| true`: this is a gate.
      - name: RTL filelist drift gate (rtl/filelist/*.f match their Makefile sources)
        run: python3 tools/verif/gen_filelist.py --check

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ruff format check
        run: |
          echo "::group::Ruff Format Check"
          ruff format --check tb/models tb/tests
          echo "::endgroup::"

      - name: Run ruff linter
        run: |
          echo "::group::Ruff Linter"
          ruff check tb/models tb/tests --exclude legacy
          echo "::endgroup::"

      - name: Run mypy type checking
        run: |
          echo "::group::MyPy Type Checking"
          mypy tb/models tb/tests --exclude 'legacy'
          echo "::endgroup::"

      - name: Run pylint
        run: |
          echo "::group::Pylint"
          pylint tb/models tb/tests --ignore=legacy
          echo "::endgroup::"

      - name: Run pytest
        run: |
          echo "::group::Pytest"
          pytest tb/tests/ -v --cov=tb.models --cov-report=term-missing --cov-report=xml
          echo "::endgroup::"

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
