# macro_placement.cfg — ASAP7 SRAM placement for rv32i_cpu_top
#
# Estimated ASAP7 SRAM dimensions (from OpenRAM ASAP7 projections):
#   sram_1rw_256x32_asap7: ~22 × 16 µm (update once OpenRAM output is available)
#
# Die core: (5, 5) to (145, 145) in a 150×150 µm die
#
# Layout: 2 rows of 5 SRAMs (tag + 4 data per cache)
#   x stride: 22 + 2 = 24 µm (2 µm routing channel)
#   Row 1 (I-cache): y = 5 µm
#   Row 2 (D-cache): y = 5 + 16 + 3 = 24 µm
#
# Note: Coordinates are placeholders — re-run floorplan once OpenRAM
# produces characterised LEF with exact SRAM dimensions.

# I-cache
u_core.u_icache.u_tag_sram                    5.00    5.00    N
u_core.u_icache.gen_data_sram[0].u_data_sram  29.00   5.00    N
u_core.u_icache.gen_data_sram[1].u_data_sram  53.00   5.00    N
u_core.u_icache.gen_data_sram[2].u_data_sram  77.00   5.00    N
u_core.u_icache.gen_data_sram[3].u_data_sram  101.00  5.00    N

# D-cache
u_core.u_dcache.u_tag_sram                    5.00    24.00   N
u_core.u_dcache.gen_data_sram[0].u_data_sram  29.00   24.00   N
u_core.u_dcache.gen_data_sram[1].u_data_sram  53.00   24.00   N
u_core.u_dcache.gen_data_sram[2].u_data_sram  77.00   24.00   N
u_core.u_dcache.gen_data_sram[3].u_data_sram  101.00  24.00   N
