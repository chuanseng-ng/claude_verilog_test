# macro_placement.cfg - SRAM macro placement for rv32i_cpu_top (ASAP7)
#
# Scope: pnr/asap7/cpu/config.json sets MACRO_PLACEMENT_CFG to this file. config_3014.json uses macro_placement_3014.cfg.
# Contents: one line per SRAM instance: instance path, x, y, orientation N. Coordinates are in micrometres.
#   Two rows of five sram_1rw_256x32_asap7 macros (adapted from the ORFS fakeram7_256x32): the I-cache tag
#   and four data banks in the lower row, the D-cache tag and four data banks in the upper row.
# Inputs: the instance paths must match the netlist hierarchy names (u_core.u_icache, u_core.u_dcache).
# User rules:
#   The x stride is the macro width plus a routing channel. Keep that channel between the macros.
#   All macros must fit inside the core boundary of the block. Standard cells use the area above the upper row.
# Doc: tm:pd:asap7-cpu-macro-placement-cfg

# I-cache
u_core.u_icache.u_tag_sram                    5.00    5.00    N
u_core.u_icache.gen_data_sram[0].u_data_sram  15.36   5.00    N
u_core.u_icache.gen_data_sram[1].u_data_sram  25.72   5.00    N
u_core.u_icache.gen_data_sram[2].u_data_sram  36.08   5.00    N
u_core.u_icache.gen_data_sram[3].u_data_sram  46.44   5.00    N

# D-cache
u_core.u_dcache.u_tag_sram                    5.00    52.00   N
u_core.u_dcache.gen_data_sram[0].u_data_sram  15.36   52.00   N
u_core.u_dcache.gen_data_sram[1].u_data_sram  25.72   52.00   N
u_core.u_dcache.gen_data_sram[2].u_data_sram  36.08   52.00   N
u_core.u_dcache.gen_data_sram[3].u_data_sram  46.44   52.00   N
