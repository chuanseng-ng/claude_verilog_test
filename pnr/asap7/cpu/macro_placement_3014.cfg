# 2026-09-09 attempt 8: all x shifted +1.365 um (half a DRT worker) off the
# original 3014 positions. Evidence: every DRT-0255 failure in attempt 7 was in
# ONE worker routeBox column, and the reported source access points sat exactly on
# that worker's right edge -- e.g. pin gen_data_sram[3]/dout0[4] ap at x=62790 DBU
# with routeBox (60060 5460)(62790 8190). The DRT worker grid is 2730 DBU (2.73 um);
# that macro's left edge (62440) sat only 350 DBU from the boundary. Shifting by half
# a worker moves every pin column to mid-worker.
# macro_placement_3014.cfg -- ASAP7 SRAM placement, WIDER ROUTING CHANNELS
#
# Derived from macro_placement.cfg for the LibreLane 3.0.14 routing bring-up
# (beads ocm / b5a). Same 2 rows x 5 SRAMs, same y, orientation and instance
# paths; ONLY the x stride changes.
#
# Why: sram_1rw_256x32_asap7 declares all 77 signal pins on M4 along its LEFT
# edge, and obstructs M1-M4 across its whole footprint -- so only M5-M7 may
# cross a macro, and every one of those 77 connections has to funnel through the
# gap beside it. The original stride was 10.36 um = 8.36 um macro + a 2.00 um
# channel. The first ASAP7 run ever to reach detailed routing failed with 16
# [ERROR DRT-0255] maze-route errors on exactly those SRAM bus pins
# (data_din0/data_dout0/data_gclk).
#
# Stride here is 14.36 um = 8.36 um macro + a 6.00 um channel (3x wider).
# Max extent x = 62.44 + 8.36 = 70.80 um, still far inside the 125 um core, so
# this costs no die area -- the macros simply spread into space that was already
# empty.
#
# NOT the cause, checked first and recorded so they are not re-tried:
#   * 24 nm M4 pin width is LEGAL -- ASAP7 M4 LEF58_WIDTHTABLE lists 0.024.
#   * Removing the M4 OBS made it WORSE (16 -> 79 DRT-0255): pin access already
#     succeeded with the OBS in place (0 DRT-0073/0074), and dropping it just let
#     over-macro M4 routing add congestion.
#   * GRT_ALLOW_CONGESTION=false changed nothing (identical 16 failures).
#
# 2026-09-09 session 2 (bead ocm) -- gen_data_sram[1] X POINT-FIX (35.09 -> 35.10).
#
# Real routing tracks (NOT the tech-LEF PITCH/OFFSET -- LibreLane overrides those via
# libs.tech/openlane/asap7sc7p5t_SIMPLE/tracks.info): M5 (vertical, the layer that
# vias up from the M4 pins) has X tracks at x = 18 + n*27 DBU. gen_data_sram[1]'s pin
# column sat at x=35090, only 1 DBU short of the nearest legal M5 track (35091) --
# signed offset -1. Every other data macro in this row (x=20720/49450/63800) sits
# 5-8 DBU off that same grid and routes cleanly.
#
# THIS WAS TESTED AS A DIRECT CAUSAL EXPERIMENT, not just correlation: using a
# standalone OpenROAD session loading the post-GRT checkpoint ODB, gen_data_sram[1]
# (both u_icache and u_dcache instances) was moved by dx=-1,+5,+10,+24 DBU with
# nothing else in the design touched, and detailed_route rerun on each:
#   dx=-1  (x=35089, signed offset -2) -> FAILS.  Identical 16 DRT-0255, same nets,
#                                          same routeBoxes as dx=0 (the unmodified
#                                          baseline).
#   dx=+5  (x=35095, signed offset +4) -> CLEAN. 0 DRT-0255 through 60% completion.
#   dx=+10 (x=35100, signed offset +9, ALSO exactly site-grid-aligned: 35100 mod 54
#           = 0) -> CLEAN. 0 DRT-0255, 0 general violations through 20% completion
#           (the cleanest of the three).
#   dx=+24 (x=35114, signed offset -4) -> CLEAN. 0 DRT-0255 through 20% completion --
#           narrows the failing window to within +/-2 DBU of the M5 track, not +/-4.
# +10 was selected: largest safety margin of the clean points tested, and it lands
# exactly on the M4 X cross-grid (site width 0.054 um = 54 DBU) as a side effect.
#
# THIS IS A POINT-FIX, NOT A VALIDATED GENERAL RULE. A positive-control experiment
# was run to test whether "small M5-grid offset" is a general, portable predictor:
# gen_data_sram[0] (originally x=20720, signed offset -7, always routes cleanly) was
# shifted by dx=+6 to x=20726 -- signed offset -1, the exact residue class (mod 27
# AND mod 54) that failed at gen_data_sram[1]. It did NOT fail: 0 new DRT-0255 near
# its shifted location; the only 16 failures in that run were gen_data_sram[1]'s own,
# unchanged, because gen_data_sram[1] was not touched in that experiment. So a small
# M5-grid offset is necessary-looking (every failing column across 3 independent
# floorplan sweeps had the smallest offset in its row) but NOT sufficient on its own
# (an off-grid-matched macro elsewhere does not automatically fail) -- some other,
# still-unidentified factor specific to gen_data_sram[1]'s context also has to be
# present. Do not generalize this into "keep every macro N DBU off the M4/M5 grid"
# without re-deriving and re-testing per instance; only the four X values changed
# below are empirically verified, by direct causal test, to be safe for THIS macro
# at THIS position in THIS floorplan.
#
# Full record, including the failed positive control: memory/pd/knowledge.md
# (UPDATE 2026-09-09 session 2, second entry) and bead ocm.


