# macro_placement_3014.cfg -- ASAP7 SRAM placement, WIDER ROUTING CHANNELS
#
# Derived from macro_placement.cfg for the LibreLane 3.0.14 routing bring-up
# (beads ocm / b5a). Same 2 rows x 5 SRAMs, same y, orientation and instance
# paths; ONLY the x stride changes.
#
# Why: sram_1rw_256x32_asap7 declares all 77 signal pins on M4 along its LEFT
# edge, and obstructs M1-M4 across its whole footprint -- so only M5-M7 may
# cross a macro, and every one of those 77 connections has to funnel through the
# gap beside it. The original stride was 10.36 um = 8.36 um macro + a 2.00 um
# channel. The first ASAP7 run ever to reach detailed routing failed with 16
# [ERROR DRT-0255] maze-route errors on exactly those SRAM bus pins
# (data_din0/data_dout0/data_gclk).
#
# Stride here is 14.36 um = 8.36 um macro + a 6.00 um channel (3x wider).
# Max extent x = 62.44 + 8.36 = 70.80 um, still far inside the 125 um core, so
# this costs no die area -- the macros simply spread into space that was already
# empty.
#
# NOT the cause, checked first and recorded so they are not re-tried:
#   * 24 nm M4 pin width is LEGAL -- ASAP7 M4 LEF58_WIDTHTABLE lists 0.024.
#   * Removing the M4 OBS made it WORSE (16 -> 79 DRT-0255): pin access already
#     succeeded with the OBS in place (0 DRT-0073/0074), and dropping it just let
#     over-macro M4 routing add congestion.
#   * GRT_ALLOW_CONGESTION=false changed nothing (identical 16 failures).


