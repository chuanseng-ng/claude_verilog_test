# macro_placement_3014.cfg -- GPU SRAM placement for LibreLane 3.0.14
#
# Identical placement to macro_placement.cfg; ONLY the hierarchy separator differs.
#
# WHY: with SYNTH_HIERARCHY_MODE=keep, LibreLane 2.4.13's netlist named these
# instances u_sm/g_bank[N].u_bank (SLASH between module levels, DOT for the leaf
# inside the generate block) -- that asymmetry is recorded in macro_placement.cfg's
# own header and in this project's notes. LibreLane 3.0.14 emits DOTS throughout:
#   sram_1rw_128x32_asap7 \u_sm.g_bank[0].u_bank
# taken directly from RUN_2026-09-10_09-35-58/05-yosys-synthesis/gpu_top.nl.v.
#
# Using the 2.4.13 slash form against 3.0.14 makes Odb.ManualMacroPlacement fail:
# it lists all 32 macros as unplaceable and the flow dies at step 16 (~23 min in).
# That is what happened on RUN_2026-09-10_09-35-58.
#
# So the project rule "SYNTH_HIERARCHY_MODE=keep requires slash paths, not dots"
# is VERSION-SPECIFIC and INVERTED under 3.0.14. Keep both files: config.json ->
# macro_placement.cfg (2.4.13), config_3014.json -> this file (3.0.14).

