# macro_placement.cfg - Placement of the 32 GPU shared-memory bank SRAMs (sram_1rw_128x32_asap7), ASAP7
#
# Scope: pnr/asap7/gpu/config.json sets MACRO_PLACEMENT_CFG to this file. config_3014.json uses macro_placement_3014.cfg.
# Contents: one line per bank: instance path, x, y, orientation N. Banks 0-15 sit in a left column and banks 16-31
#   in a right column, each four rows by four columns. A wide routing corridor separates the two columns.
# Inputs: the instance paths must match the ODB names. With SYNTH_HIERARCHY_MODE=keep in LibreLane 2.4.13,
#   the name has a slash between module levels and a dot for the leaf inside the generate block.
#   Write u_sm/g_bank[N].u_bank, not u_sm/g_bank[N]/u_bank.
# User rules:
#   This slash form is specific to LibreLane 2.4.13. LibreLane 3.0.14 uses dots, so macro_placement_3014.cfg holds that form.
#   Keep both files.
# Doc: tm:pd:asap7-gpu-macro-placement-cfg
