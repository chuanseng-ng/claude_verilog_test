# =============================================================================
# SoC ASAP7 Hard-Macro Placement Configuration
# =============================================================================
#
# Hierarchy strategy (bottom-up hierarchical):
#   - CPU hard macro (rv32i_cpu_top):  130×130 µm hard macro view
#   - GPU hard macro (gpu_top):        340×340 µm hard macro view
#   - SRAM:  synthesised black-box; placed by LibreLane PDN macro grid
#   - Flat:  axi4_crossbar, axi_lite_interconnect, dma_engine, uart_controller,
#            spi_controller, timer, interrupt_controller, sram_controller,
#            boot_rom, pll stubs  (~15 KB gates total)
#
# Die:  720×720 µm   (0 0 720 720)
# Core: 700×700 µm   (10 10 710 710)
#
# Layout strategy (SW/SE quadrant split):
#   GPU (340×340): lower-left quadrant, pinned against SW corner with halo.
#   CPU (130×130): lower-right quadrant, leaving upper half for flat logic +
#                  AXI crossbar routing channels.
#
# Halo: 5 µm on all sides (PL_MACRO_HALO = "5 5")
#
# Coordinate origin: (0,0) = die lower-left.
# Instance paths must match the soc_top instantiation names.
# =============================================================================

# GPU hard macro — lower-left.
# Origin: (15, 15) → leaves 5 µm die-edge clearance + 5 µm halo.
# GPU footprint: 340×340 µm.  Right edge @ 15+340 = 355.  Top edge @ 15+340 = 355.
# Orientation: N (no flip) — AXI master ports on east face toward crossbar.
u_gpu 15 15 N

# CPU hard macro — lower-right.
# Origin: (565, 15) → right edge @ 565+130 = 695 (5 µm from core boundary 710).
# Leaves a ~205 µm routing channel between GPU east face (355) and CPU west face (565).
# CPU footprint: 130×130 µm.  Top edge @ 15+130 = 145.
# Orientation: N — AXI master ports on north/east face toward crossbar.
u_cpu 565 15 N

