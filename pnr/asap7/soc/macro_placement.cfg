# macro_placement.cfg - Hard-macro placement for the ASAP7 SoC (soc_top with the CPU and GPU hard macros)
#
# Scope: pnr/asap7/soc/config.json and the config_multiclock*.json files set MACRO_PLACEMENT_CFG to this file.
# Contents: u_gpu in the lower-left and u_cpu in the lower-right, each with x, y and orientation N.
#   Coordinates are in micrometres. The origin (0,0) is the lower-left corner of the die.
# Inputs: the instance paths must match the soc_top instantiation names. The macro views set the footprints.
# User rules:
#   The origins leave die-edge clearance and a gap between the macros. LibreLane enforces a halo around each macro through the PDN macro grid.
#   The SRAM inside sram_controller is a synthesised black box. LibreLane places it through the macro PDN grid.
#   If LibreLane needs explicit placement for it, add its instance path from the synthesis output.
# Doc: tm:pd:asap7-soc-macro-placement-cfg
# u_gpu: lower-left. The origin leaves die-edge clearance and the macro halo.
# Orientation N (no flip): the AXI master ports face east toward the crossbar.
u_gpu 15 15 N

# u_cpu: lower-right. The origin leaves a gap to u_gpu and to the core boundary.
# Orientation N: the AXI master ports face north and east toward the crossbar.
u_cpu 365 15 N

# =============================================================================
# SRAM black-box macros (sram_controller's internal SRAMs)
# Placed by LibreLane's macro PDN grid; no explicit placement coordinates needed
# for the synthesised SRAM stub.  If LibreLane requires explicit placement for
# the 256x32 stub instance inside u_sram, add it here once the instance path
# is known from synthesis output.
# =============================================================================
