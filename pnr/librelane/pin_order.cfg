#================================================================
# LibreLane Pin Order Configuration
# Design: rv32i_cpu_top (Phase 3)
# Format: one signal name (or glob) per line under a direction header
#
# Directions:
#   #N — north (top) edge
#   #S — south (bottom) edge
#   #E — east (right) edge
#   #W — west (left) edge
#
# Strategy:
#   North  — AXI4-Lite inputs (AR, R channels — read path)
#   South  — AXI4-Lite outputs (AW, W channels — write path)
#   East   — APB3 debug interface + interrupt inputs
#   West   — Clock, reset, commit/observability outputs
#
# This grouping keeps AXI read/write channel wires short relative to
# a hypothetical L2 cache/DRAM controller placed above the die, and
# puts the low-speed debug interface on a separate edge from the
# critical AXI path.
#================================================================

#N
# AXI4-Lite read channel inputs — from memory subsystem
axi_arready_i
axi_rdata_i
axi_rresp_i
axi_rvalid_i

# AXI4-Lite write response inputs
axi_awready_i
axi_wready_i
axi_bresp_i
axi_bvalid_i

#S
# AXI4-Lite read address channel outputs
axi_araddr_o
axi_arvalid_o
axi_rready_o

# AXI4-Lite write address channel outputs
axi_awaddr_o
axi_awvalid_o

# AXI4-Lite write data channel outputs
axi_wdata_o
axi_wstrb_o
axi_wvalid_o
axi_bready_o

#E
# APB3 debug slave inputs
apb_paddr_i
apb_psel_i
apb_penable_i
apb_pwrite_i
apb_pwdata_i

# APB3 debug slave outputs
apb_prdata_o
apb_pready_o
apb_pslverr_o

# Interrupt inputs
ext_irq_i
timer_irq_i

#W
# Clock and reset
clk_i
rst_n_i

# Commit interface (verification observability)
commit_valid_o
commit_pc_o
commit_insn_o
trap_taken_o
trap_cause_o

# Debug observability outputs
debug_rs1_data_o
debug_rs2_data_o
debug_branch_taken_o
debug_take_branch_jump_o
debug_pc_src_o
debug_state_o
debug_ebreak_o
