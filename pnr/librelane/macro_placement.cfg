# macro_placement.cfg
# Phase 3 cache SRAM macro placement
#
# Instance names must match the DEF component names (dot-separated,
# flat hierarchy as produced by Yosys synthesis).
#
# Die area  : [0, 0, 3400, 1800] µm
# Core area : [20, 20, 3380, 1780] µm
#
# Layout (orientation S = 180°, pins face UP):
#   Row 0 (y=20..417.5)  : I-cache SRAMs — pins at y=417.5 (top)
#   Channel (y=417.5..520): 102.5 µm routing channel — I-cache pin access
#   Row 1 (y=520..917.5) : D-cache SRAMs — pins at y=917.5 (top)
#   Logic zone (y=917.5..1780): standard-cell logic, 862 µm tall
#
# Orientation S rationale:
#   All sky130_sram_1kbyte_1rw1r_32x256_8 pins are on met4 at local y=0.
#   With orientation N, pins are at y=20 (bottom), forcing signal wires
#   to travel ~900 µm down from the logic zone — causing met1 overflow
#   and shorts at the unprotected 0.62 µm strip at the SRAM bottom edge.
#   With orientation S (180°), pins flip to the top of each macro:
#     I-cache pins → y=417.5 (into the 102.5 µm routing channel above)
#     D-cache pins → y=917.5 (at the logic-zone boundary, ~0 µm travel)
#   LEF declares SYMMETRY X Y R90, so orientation S is fully supported.
#
# SRAM size: 479.78 x 397.5 µm  (sky130_sram_1kbyte_1rw1r_32x256_8)
# Left halo : 100 µm  (tag SRAM left edge at x=100, gives PDN clearance)
# X stride  : 579.78 µm  (100 µm routing channel between macros)
# Right margin: 481 µm (from last macro right edge x=2898.9 to core right x=3380)
#
# Format: <instance_name> <x> <y> <orientation>

# ── I-cache SRAMs (bottom row, y=20..417.5, pins at top y=417.5) ─────────────
u_core.u_icache.u_tag_sram                          100.00    20.00   S
u_core.u_icache.gen_data_sram[0].u_data_sram        679.78    20.00   S
u_core.u_icache.gen_data_sram[1].u_data_sram       1259.56    20.00   S
u_core.u_icache.gen_data_sram[2].u_data_sram       1839.34    20.00   S
u_core.u_icache.gen_data_sram[3].u_data_sram       2419.12    20.00   S

# ── D-cache SRAMs (second row, y=520..917.5, pins at top y=917.5) ────────────
u_core.u_dcache.u_tag_sram                          100.00   520.00   S
u_core.u_dcache.gen_data_sram[0].u_data_sram        679.78   520.00   S
u_core.u_dcache.gen_data_sram[1].u_data_sram       1259.56   520.00   S
u_core.u_dcache.gen_data_sram[2].u_data_sram       1839.34   520.00   S
u_core.u_dcache.gen_data_sram[3].u_data_sram       2419.12   520.00   S
