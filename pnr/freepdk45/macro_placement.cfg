# macro_placement.cfg - FreePDK45 SRAM placement for rv32i_cpu_top
#
# Scope: pnr/freepdk45/config.json sets MACRO_PLACEMENT_CFG to this file.
# Contents: one line per SRAM instance: instance path, x, y, orientation N. Coordinates are in micrometres.
#   Two rows of five OpenRAM macros (a tag SRAM and four data SRAMs per cache). The I-cache row is below, the D-cache row above, at the same x positions.
# Inputs: the macro dimensions come from the OpenRAM LEF.
# User rules:
#   The x stride is the macro width plus a routing channel. The rows are separated by a routing channel.
#   The left margin keeps PDN clearance.
# Doc: tm:pd:freepdk45-macro-placement-cfg

# I-cache
u_core.u_icache.u_tag_sram                    10.00    10.00    N
u_core.u_icache.gen_data_sram[0].u_data_sram  152.83   10.00    N
u_core.u_icache.gen_data_sram[1].u_data_sram  295.66   10.00    N
u_core.u_icache.gen_data_sram[2].u_data_sram  438.49   10.00    N
u_core.u_icache.gen_data_sram[3].u_data_sram  581.32   10.00    N

# D-cache
u_core.u_dcache.u_tag_sram                    10.00    144.20   N
u_core.u_dcache.gen_data_sram[0].u_data_sram  152.83   144.20   N
u_core.u_dcache.gen_data_sram[1].u_data_sram  295.66   144.20   N
u_core.u_dcache.gen_data_sram[2].u_data_sram  438.49   144.20   N
u_core.u_dcache.gen_data_sram[3].u_data_sram  581.32   144.20   N
