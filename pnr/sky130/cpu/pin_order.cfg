#================================================================
# Pin Order Configuration — rv32i_cpu_top Sky130 Stage 1
# Format: one signal name (or glob) per line under a direction header
#
# Directions:
#   #N — north (top) edge
#   #S — south (bottom) edge
#   #E — east (right) edge
#   #W — west (left) edge
#
# Strategy (unchanged from Phase 3):
#   North  — AXI4 inputs (AR read channel, R response)
#   South  — AXI4 outputs (AW write channel, W data, AR addr)
#   East   — APB3 debug interface + interrupt inputs
#   West   — Clock, reset, commit/observability outputs
#
# AXI4 burst ports added vs Phase 3 pin_order.cfg:
#   rlast_i   → North (read channel input)
#   arlen_o, arsize_o, arburst_o → South (read address channel output)
#   awlen_o, awsize_o, awburst_o → South (write address channel output)
#   wlast_o   → South (write data channel output)
#================================================================

#N
# AXI4 read channel inputs — from memory subsystem
axi_arready_i
axi_rdata_i
axi_rresp_i
axi_rvalid_i
axi_rlast_i

# AXI4 write response inputs
axi_awready_i
axi_wready_i
axi_bresp_i
axi_bvalid_i

#S
# AXI4 read address channel outputs
axi_araddr_o
axi_arlen_o
axi_arsize_o
axi_arburst_o
axi_arvalid_o
axi_rready_o

# AXI4 write address channel outputs
axi_awaddr_o
axi_awlen_o
axi_awsize_o
axi_awburst_o
axi_awvalid_o

# AXI4 write data channel outputs
axi_wdata_o
axi_wstrb_o
axi_wlast_o
axi_wvalid_o
axi_bready_o

#E
# APB3 debug slave inputs
apb_paddr_i
apb_psel_i
apb_penable_i
apb_pwrite_i
apb_pwdata_i

# APB3 debug slave outputs
apb_prdata_o
apb_pready_o
apb_pslverr_o

# Interrupt inputs
ext_irq_i
timer_irq_i

#W
# Clock and reset
clk_i
rst_n_i

# Commit interface (verification observability)
commit_valid_o
commit_pc_o
commit_insn_o
trap_taken_o
trap_cause_o

# Debug observability outputs
debug_rs1_data_o
debug_rs2_data_o
debug_branch_taken_o
debug_take_branch_jump_o
debug_pc_src_o
debug_state_o
debug_ebreak_o
