# SRAM size: 479.78 x 397.5 µm  (sky130_sram_1kbyte_1rw1r_32x256_8)
# Left halo : 100 µm
# X stride  : 579.78 µm  (100 µm routing channel between macros)
#
# Format: <instance_name> <x> <y> <orientation>

