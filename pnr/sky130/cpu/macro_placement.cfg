# macro_placement.cfg - Sky130 CPU Stage 1: placement of the cache SRAM macros for rv32i_cpu_top
#
# Scope: pnr/sky130/cpu/config.json sets MACRO_PLACEMENT_CFG to this file.
# Contents: one line per SRAM instance: <instance_name> <x> <y> <orientation>. Orientation N, pins at the bottom. Coordinates are in micrometres.
#   Row 0 holds the I-cache SRAMs, then a routing channel, then row 1 with the D-cache SRAMs. Standard-cell logic fills the zone above row 1.
#   The macro is sky130_sram_1kbyte_1rw1r_32x256_8.
# Inputs: the instance names must match the DEF component names (dot-separated, flat hierarchy from Yosys synthesis).
# User rules:
#   The file has no ROUTING_OBSTRUCTIONS. The native SRAM LEF OBS (met1 and met2, full footprint) handles interior blockage.
#   The wide gaps between the data SRAMs provide routing channels.
# Doc: tm:pd:sky130-cpu-macro-placement-cfg

# ── I-cache SRAMs (bottom row, y=20..417.5) ──────────────────────────────────
u_core.u_icache.u_tag_sram                          100.00    20.00   N
u_core.u_icache.gen_data_sram[0].u_data_sram        679.78    20.00   N
u_core.u_icache.gen_data_sram[1].u_data_sram       1359.56    20.00   N
u_core.u_icache.gen_data_sram[2].u_data_sram       2039.34    20.00   N
u_core.u_icache.gen_data_sram[3].u_data_sram       2719.12    20.00   N

# ── D-cache SRAMs (second row, y=520..917.5) ─────────────────────────────────
u_core.u_dcache.u_tag_sram                          100.00   520.00   N
u_core.u_dcache.gen_data_sram[0].u_data_sram        679.78   520.00   N
u_core.u_dcache.gen_data_sram[1].u_data_sram       1359.56   520.00   N
u_core.u_dcache.gen_data_sram[2].u_data_sram       2039.34   520.00   N
u_core.u_dcache.gen_data_sram[3].u_data_sram       2719.12   520.00   N
