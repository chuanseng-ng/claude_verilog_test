# macro_placement.cfg — Sky130 CPU Stage 1
# Phase 3 cache SRAM macro placement.
#
# Instance names must match the DEF component names (dot-separated,
# flat hierarchy as produced by Yosys synthesis).
#
# Die area  : [0, 0, 3600, 1800] µm  (Run 6: widened from 3200 for routing headroom)
# Core area : [20, 20, 3580, 1780] µm
#
# Layout (orientation N, pins at bottom):
#   Row 0 (y=20..417.5)   : I-cache SRAMs — pins at bottom y=20
#   Channel (y=417.5..520) : 102.5 µm routing channel
#   Row 1 (y=520..917.5)  : D-cache SRAMs — pins at bottom y=520
#   Logic zone (y=917.5..1780): standard-cell logic
#
# SRAM size: 479.78 x 397.5 µm  (sky130_sram_1kbyte_1rw1r_32x256_8)
# Left halo : 100 µm
# tag→data[0] gap: 100 µm (x 579.78→679.78)
# data[0→1,1→2,2→3] gaps: 200 µm  (widened from 100 µm in Run 5)
#
# No ROUTING_OBSTRUCTIONS: native SRAM LEF OBS (met1/met2 full-footprint)
# handles interior blockage. Wider 200 um gaps provide routing channels.
#
# Format: <instance_name> <x> <y> <orientation>

# ── I-cache SRAMs (bottom row, y=20..417.5) ──────────────────────────────────
u_core.u_icache.u_tag_sram                          100.00    20.00   N
u_core.u_icache.gen_data_sram[0].u_data_sram        679.78    20.00   N
u_core.u_icache.gen_data_sram[1].u_data_sram       1359.56    20.00   N
u_core.u_icache.gen_data_sram[2].u_data_sram       2039.34    20.00   N
u_core.u_icache.gen_data_sram[3].u_data_sram       2719.12    20.00   N

# ── D-cache SRAMs (second row, y=520..917.5) ─────────────────────────────────
u_core.u_dcache.u_tag_sram                          100.00   520.00   N
u_core.u_dcache.gen_data_sram[0].u_data_sram        679.78   520.00   N
u_core.u_dcache.gen_data_sram[1].u_data_sram       1359.56   520.00   N
u_core.u_dcache.gen_data_sram[2].u_data_sram       2039.34   520.00   N
u_core.u_dcache.gen_data_sram[3].u_data_sram       2719.12   520.00   N
