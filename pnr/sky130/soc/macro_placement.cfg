# macro_placement.cfg — Sky130 SoC Stage 2 hard macro placement
#
# TWO hard macros: CPU (rv32i_cpu_top) + SRAM (sky130_sram_4kbyte_1rw1r_32x1024_8,
# a freshly-compiled OpenRAM macro). GH #104 UPDATE (2026-07-23/24): this
# REVERSES the earlier Option C behavioral-SRAM revert. The prior custom-
# hardened composite sram_controller macro (whole AXI4 wrapper + memory
# array hardened as one ~2585x2595um block) is ABANDONED -- it hit an
# unresolved ~7,400-node PSM-0069 VPWR/VGND connectivity gap that survived
# ring removal, instance-specific grids, and precisely-anchored straps
# (see memory/pd/run_state.md for the full multi-round diagnostic trail).
# Instead, only the raw OpenRAM SRAM primitive is now a hard macro: a
# fresh sky130_sram_4kbyte_1rw1r_32x1024_8 compile (1024 x 32b, 4 KB,
# 1RW+1R), instantiated as u_sram_macro inside the still-synthesisable
# rtl/soc/sram_controller.sv control-logic RTL. Flattened into the
# top-level netlist it becomes instance path `u_sram.u_sram_macro`
# (CONFIRMED via a Yosys.Synthesis-only probe run, tag
# SRAM_MACRO_SYNTH_PROBE, before writing this file -- do not guess this
# name, dot-separator is Yosys's default `flatten` naming and differs
# from the slash convention used under SYNTH_HIERARCHY_MODE=keep).
# This macro has a standard OpenRAM PG abstract (vccd1/vssd1 on
# met3+met4) already proven connectable -- rv32i_cpu_top's own 10
# internal OpenRAM SRAMs (from its Stage-1 P&R) are PSM-0040 clean with
# an identical pin style. It is also ~14x smaller in area (701.64 x
# 673.335 um, confirmed from the generated LEF) than the failed
# composite block, giving far more floorplan headroom than before.
#
# Die: 6700 x 3100 um (kept at the GRT-proven-clean size). Core area:
# (20,20)-(6680,3080).
#
# CPU macro: rv32i_cpu_top (regenerated balanced-pin GDS, RUN_2026-07-21_18-02-11)
#   - Footprint: 3600 x 1800 um
#   - x_origin = 150 (unchanged, no observed X-direction violations)
#   - y_origin = 207.0 (= 6.9 x 30, exact GRT GCell-grid multiple -- see
#     GH #104 GRT-0118 root-cause writeup, still valid and unaffected by
#     the SRAM-macro re-addition)
#   - Occupies: (150, 207.0) to (3750, 2007.0)
#
# SRAM macro: sky130_sram_4kbyte_1rw1r_32x1024_8 (OpenRAM compile,
#   views_run.log, 2026-07-23/24, check_lvsdrc=False views-first pass)
#   - Footprint: 701.64 x 673.335 um (confirmed from the generated LEF)
#   - x_origin = 4209.0 (= 6.9 x 610, exact GRT GCell-grid multiple, same
#     alignment discipline that fixed CPU's GRT-0118 congestion)
#   - y_origin = 207.0 (= 6.9 x 30, same GCell row as CPU's south edge --
#     places the two macros side by side on a shared alignment line)
#   - Occupies: (4209.0, 207.0) to (4910.64, 880.335)
#   - Clearance from CPU's right edge (x=3750): 459 um gap -- the failed
#     composite SRAM macro only ever had a fraction of this slack at this
#     die size; this macro's much smaller footprint gives far more
#     escape-routing room on every side.
#   - Clearance to core right edge (x=6680): 1769.36 um.
#
# Everything else (peripherals: crossbar, DMA, UART, SPI, timer, IRQ ctrl,
# PLL stub, GPU tie-off, boot_rom, sram_controller's own control-logic
# RTL) is flat standard-cell logic filling the remaining area.
#
# Format: <instance_name> <x_origin> <y_origin> <orientation>
u_cpu                 150     207.0 N
u_sram.u_sram_macro   4209.0  207.0 N
