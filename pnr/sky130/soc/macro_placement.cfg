# macro_placement.cfg — Sky130 SoC Stage 2 hard macro placement
#
# THREE hard macros since Phase 6 Gate B (bead f7vs.15, 2026-10-04): CPU
# (rv32i_cpu_top) + SRAM (sky130_sram_4kbyte_1rw1r_32x1024_8, a freshly-
# compiled OpenRAM macro) + a SECOND instance of that same SRAM cell for the
# INT8 NPU's weight memory (see the "NPU weight SRAM" block below).
# (The history in this paragraph describes the two-macro Stage-2 design.) GH #104 UPDATE (2026-07-23/24): this
# REVERSES the earlier Option C behavioral-SRAM revert. The prior custom-
# hardened composite sram_controller macro (whole AXI4 wrapper + memory
# array hardened as one ~2585x2595um block) is ABANDONED -- it hit an
# unresolved ~7,400-node PSM-0069 VPWR/VGND connectivity gap that survived
# ring removal, instance-specific grids, and precisely-anchored straps
# (see memory/pd/run_state.md for the full multi-round diagnostic trail).
# Instead, only the raw OpenRAM SRAM primitive is now a hard macro: a
# fresh sky130_sram_4kbyte_1rw1r_32x1024_8 compile (1024 x 32b, 4 KB,
# 1RW+1R), instantiated as u_sram_macro inside the still-synthesisable
# rtl/soc/sram_controller.sv control-logic RTL. Flattened into the
# top-level netlist it becomes instance path `u_sram.u_sram_macro`
# (CONFIRMED via a Yosys.Synthesis-only probe run, tag
# SRAM_MACRO_SYNTH_PROBE, before writing this file -- do not guess this
# name, dot-separator is Yosys's default `flatten` naming and differs
# from the slash convention used under SYNTH_HIERARCHY_MODE=keep).
# This macro has a standard OpenRAM PG abstract (vccd1/vssd1 on
# met3+met4) already proven connectable -- rv32i_cpu_top's own 10
# internal OpenRAM SRAMs (from its Stage-1 P&R) are PSM-0040 clean with
# an identical pin style. It is also ~14x smaller in area (701.64 x
# 673.335 um, confirmed from the generated LEF) than the failed
# composite block, giving far more floorplan headroom than before.
#
# Die: 6700 x 3100 um (kept at the GRT-proven-clean size). Core area:
# (20,20)-(6680,3080).
#
# CPU macro: rv32i_cpu_top (regenerated balanced-pin GDS, RUN_2026-07-21_18-02-11)
#   - Footprint: 3600 x 1800 um
#   - x_origin = 150 (unchanged, no observed X-direction violations)
#   - y_origin = 207.0 (= 6.9 x 30, exact GRT GCell-grid multiple -- see
#     GH #104 GRT-0118 root-cause writeup, still valid and unaffected by
#     the SRAM-macro re-addition)
#   - Occupies: (150, 207.0) to (3750, 2007.0)
#
# SRAM macro: sky130_sram_4kbyte_1rw1r_32x1024_8 (OpenRAM compile,
#   views_run.log, 2026-07-23/24, check_lvsdrc=False views-first pass)
#   - Footprint: 701.64 x 673.335 um (confirmed from the generated LEF)
#   - x_origin = 4209.0 (= 6.9 x 610, exact GRT GCell-grid multiple, same
#     alignment discipline that fixed CPU's GRT-0118 congestion)
#   - y_origin = 207.0 (= 6.9 x 30, same GCell row as CPU's south edge --
#     places the two macros side by side on a shared alignment line)
#   - Occupies: (4209.0, 207.0) to (4910.64, 880.335)
#   - Clearance from CPU's right edge (x=3750): 459 um gap -- the failed
#     composite SRAM macro only ever had a fraction of this slack at this
#     die size; this macro's much smaller footprint gives far more
#     escape-routing room on every side.
#   - Clearance to core right edge (x=6680): 1769.36 um.
#
# NPU weight SRAM (Phase 6c, bead f7vs.11; placed by Gate B, bead f7vs.15):
#   a SECOND instance of the same sky130_sram_4kbyte_1rw1r_32x1024_8 cell, so
#   the footprint, LEF, PG abstract and orientation are identical to the SoC
#   SRAM above. Instance path READ from a Yosys.Synthesis-only probe of the
#   Gate-B netlist (run tag GATEB_NPU_SRAM_PROBE; sv2v with
#   --define=SRAM_SKY130), NOT guessed:
#       \u_npu.g_on.u_wmem.u_sram_macro        (netlist: escaped identifier)
#   i.e. u_npu -> generate block g_on -> u_wmem (npu_weight_mem) ->
#   u_sram_macro. Note the two intermediate segments: the obvious guess
#   "u_npu.u_sram_macro" would have been wrong. The same probe shows exactly 2
#   instances of the 4 KB cell and the existing u_sram.u_sram_macro path
#   unchanged. `\` is the Verilog escape and is not part of the name.
#   - Footprint: 701.64 x 673.335 um (same LEF)
#   - x_origin = 5078.4 (= 6.9 x 736, exact GRT GCell-grid multiple).
#     NB 5078.1 is NOT a multiple (5078.1 / 6.9 = 735.96); 6.9 x 736 = 5078.4.
#     Checked with exact decimal arithmetic, together with 4209.0 (6.9 x 610)
#     and 207.0 (6.9 x 30), which are unchanged.
#   - y_origin = 207.0 (= 6.9 x 30, same GCell row and same south alignment
#     line as the CPU and the SoC SRAM -- all three macros share one baseline)
#   - Occupies: (5078.4, 207.0) to (5780.04, 880.335)
#   - Clearance from the SoC SRAM's right edge (x=4910.64): 167.76 um. The PDN
#     macro grid uses -halo "10 10" (pdn.tcl), so each macro reserves 10 um
#     per side and the two halos (20 um total) leave ~148 um of free channel
#     between them for escape routing. That is narrower than the CPU<->SRAM
#     gap (459 um); the gap is a judgement call, not a measured requirement --
#     the Gate-B run's GRT/DRT congestion result is the test of it.
#   - Clearance to core right edge (x=6680): 899.96 um.
#   - Clearance below the south edge (core bottom y=20): 187 um, the same
#     space the existing SRAM already routes its south-edge pins through (the
#     LEF's signal pins are predominantly on the south/north edges).
#   Why right of the SoC SRAM and not stacked above it: the strip
#   x in [4910.64, 6680] x y in [20, 3080] is macro-free core, so the
#   same-baseline row reuses the proven south alignment line and the same
#   macro-grid (met4/met5) stitching as the existing SRAM, and leaves the band
#   above both SRAMs free for standard cells. Stacking above (earliest GCell-
#   aligned y is 6.9 x 128 = 883.2, before any halo/escape clearance) was the
#   alternative; it would put the NPU weight memory directly between the SoC
#   SRAM and the standard-cell logic above it. Not measured either way.
#   Power: matched by config.json's PDN_MACRO_CONNECTIONS regex
#   ".*u_sram_macro.*  VPWR VGND vccd1 vssd1" (substring match on the leaf
#   name, no config edit). That this actually binds is VERIFIED from the run's
#   own PDN/PSM output, not assumed -- see the Gate-B record in the bead.
#
# Everything else (peripherals: crossbar, DMA, UART, SPI, timer, IRQ ctrl,
# PLL stub, GPU tie-off, boot_rom, sram_controller's own control-logic
# RTL) is flat standard-cell logic filling the remaining area.
#
# Format: <instance_name> <x_origin> <y_origin> <orientation>
u_cpu                 150     207.0 N
u_sram.u_sram_macro   4209.0  207.0 N
u_npu.g_on.u_wmem.u_sram_macro  5078.4  207.0 N
