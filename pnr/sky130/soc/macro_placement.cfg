# macro_placement.cfg - Hard-macro placement for the Sky130 SoC (CPU macro and two 4 KB SRAM macros)
#
# Scope: pnr/sky130/soc/config.json and config_rccal.json set MACRO_PLACEMENT_CFG to this file.
# Contents: one line per macro: <instance_name> <x_origin> <y_origin> <orientation>. Origins are in micrometres.
#   Three hard macros: u_cpu (rv32i_cpu_top), u_sram.u_sram_macro (the SoC SRAM) and u_npu.g_on.u_wmem.u_sram_macro (the NPU weight SRAM).
#   Both SRAMs are sky130_sram_4kbyte_1rw1r_32x1024_8. All other logic is flat standard-cell logic that fills the remaining area.
#   The die stays at the size that global routing proved clean.
# Inputs: the instance paths must match the flat netlist names. The separator is a dot (the Yosys flatten default),
#   not the slash of SYNTH_HIERARCHY_MODE=keep. Read each path from a synthesis-only probe. Do not guess it.
#   The NPU path has two middle segments, g_on and u_wmem.
# User rules:
#   The y origin and the SRAM x origins are exact multiples of the GRT GCell pitch (6.9). Keep that alignment.
#   Name each SRAM macro instance u_sram_macro. PDN_MACRO_CONNECTIONS matches that leaf name for the VPWR and VGND connection.
#   The PDN macro grid reserves a halo on each side of a macro (pdn.tcl). The gap between the two SRAM macros is a judgement call, not a measured requirement.
# Doc: tm:pd:sky130-soc-macro-placement-cfg, cr:pd:sky130-soc-macro-placement-cfg
u_cpu                 150     207.0 N
u_sram.u_sram_macro   4209.0  207.0 N
u_npu.g_on.u_wmem.u_sram_macro  5078.4  207.0 N
