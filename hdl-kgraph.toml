# hdl-kgraph build config — keeps the HDL property graph (.hdl-kgraph/graph.db)
# scoped to live design + testbench sources only.
#
# Without these excludes, the build also indexes stale P&R work copies and
# synthesized netlists under pnr/ (3 OpenLane run snapshots) and the archived
# Phase 1 core under micro_p/. That inflates every query: e.g.
# `who_instantiates rv32i_dcache` returns 36 duplicated hits instead of 1.
#
# Rebuild after RTL changes:  hdl-kgraph build .      (excludes applied)
# Or incrementally:           hdl-kgraph update

[build]
exclude = [
    "pnr/**",       # OpenLane/LibreLane run dirs: build copies + synth netlists
    "slpp_all/**",  # stray Yosys synth work dir at repo root (duplicate GPU nodes)
    "micro_p/**",   # archived Phase 1 single-cycle core
]
