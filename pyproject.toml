[project]
name = "rv32i-cpu-verification"
version = "0.1.0"
description = "RV32I RISC-V CPU verification framework with pyuvm"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.8.0",
    "pylint>=3.0.0",
    "ruff>=0.1.0",
    "cocotb>=1.8.0",
    "pyuvm>=3.0.0",
    "pre-commit>=3.5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.8.0",
    "pylint>=3.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tb"]

# Note: tb/cpu_uvm contains the pyuvm-based verification components
# (renamed from tb/pyuvm to avoid conflict with the pyuvm package)

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tb/cocotb/cpu/legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "E402",  # Allow imports after sys.path setup in wrapper files
    "N802",  # Allow uppercase function names (RISC-V instruction mnemonics)
    "N806",  # Allow uppercase variable names in functions (constants)
]

[tool.ruff.lint.per-file-ignores]
"tb/cocotb/cpu/test_*.py" = ["E402"]  # Path setup before imports in wrapper files
"sim/riscv_encoder.py" = ["N802"]  # RISC-V mnemonics should be uppercase

[tool.pytest.ini_options]
testpaths = ["tb/tests", "tb/cpu_uvm/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
no_implicit_reexport = false
exclude = [
    "tb/cocotb/cpu/legacy/",
    "tb/cocotb/bfm/",
    "tb/cocotb/common/",
]

# Suppress warnings about untyped third-party libraries
[[tool.mypy.overrides]]
module = ["pyuvm.*", "cocotb.*", "cocotb"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["tb.models.gpu_kernel_model"]
# GPU model is Phase 4 - ignore type errors for now
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = [
    "tb.cpu_uvm.*",
    "tb.cocotb.*",
]
# Disable import-untyped for test code that uses pyuvm/cocotb
disable_error_code = ["import-untyped"]

[tool.coverage.run]
source = ["tb"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# Pylint config lives in .pylintrc (single source of truth — bare `pylint`
# invocations in CI auto-load it). See docs/development/CODING_GUIDELINES.md.
