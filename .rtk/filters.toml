# Project-local RTK filters for the RV32I + GPU-lite SoC repo.
#
# Why: the simulation/lint flows here run through `nix develop --command make ...`
# and emit 200-2000 lines of build chatter per suite (one 26-test suite measured at
# 244 lines / 35 KB); the verdict is 1-5 lines of that. These filters keep the
# verdict, the failures and anything unrecognised, and drop the known noise.
#
# Register with `rtk trust` (run once, in this directory). Validate with `rtk verify`.
# Precedence: project-local filters override ~/.config/rtk/filters.toml and the
# built-in filters, so each match_command below is kept narrow on purpose --
# `make librelane-*` deliberately does NOT match, it is already handled by the
# built-in `make` filter at ~99.9%.

schema_version = 1

# ---------------------------------------------------------------------------
# cocotb suites: make -C tb/cocotb/... and make -C sim ...
# ---------------------------------------------------------------------------
[filters.soc-sim]
description = "cocotb/Verilator suite output — keep the pass/fail tally, failures and errors"
match_command = "^(nix\\s+(develop|shell)\\s+(--command\\s+)?)?(rtk\\s+)?make\\b.*-C\\s+\\S*(tb/cocotb|sim)\\b"
strip_ansi = true
truncate_lines_at = 220
# cocotb logs, Verilator and gcc all write to stderr — without this the bulk of the
# noise bypasses the filter entirely. Measured on `make -C tb/cocotb/soc async_axi_fifo`:
# 244 lines / 35 KB raw -> 87 lines without filter_stderr -> 2 lines with it.
filter_stderr = true
strip_lines_matching = [
  "^\\s*$",
  # nix devshell preamble
  "^warning: Git tree ",
  "^soc sim\\+lint env ready",
  "^Python/cocotb come from system",
  # make bookkeeping and echoed recipe lines
  "^make(\\[[0-9]+\\])?: (Entering|Leaving) directory",
  "^make(\\[[0-9]+\\])? (clean|MODULE=|-C |-f )",
  "^\"?[^\"]*make\"? -f ",
  "^(rm|mkdir|ln|cp|mv) ",
  "^MODULE=",
  "^verilator\\s",
  "^\\t",
  # compiler / verilator driver invocations (echoed full paths)
  "^/nix/store/",
  "^/usr/bin/python3 ",
  "^/home/[^ ]*/(sim/cxx_shim\\.sh|\\.local/)",
  # C++ include-trace and the harmless _FORTIFY_SOURCE warning
  "^In file included from ",
  "^\\s+from \\S+[,:]$",
  "^\\s+[0-9]+ \\|",
  "^\\s+\\|",
  "^\\s+\\^~*$",
  "warning: #warning _FORTIFY_SOURCE",
  # verilator banner / stats
  "^- V e r i l a t i o n",
  "^- Verilator: ",
  "^- :0: Verilog \\$finish",
  # cocotb per-test progress chatter (results-table rows carry no INFO token)
  "^\\s*-?[0-9.]*-?\\.?-?-?ns\\s+INFO\\s",
  "^\\s+mkdir -p /tmp/cocotb_nix_compat",
  # Known-benign, every-run cocotb warm-up traceback: cocotb tries to install
  # pytest's assertion-rewrite hook, which drags in anyio -> ssl -> libssl.so.3,
  # absent under the nix devshell. Tests run unaffected (bead `npz`). Only
  # pytest/pluggy/anyio/importlib internals are stripped — a real test traceback
  # points at tb/cocotb/... or test_*.py and still survives.
  "Configuring the assertion rewrite hook using pytest",
  "^\\s+ImportError: libssl\\.so\\.3: cannot open shared object",
  "^\\s+File \"[^\"]*(_pytest|pluggy|anyio)/",
  "^\\s+File \"<frozen importlib\\._bootstrap>\"",
  "^\\s+File \"/usr/lib/python3\\.[0-9]+/(importlib|ssl)",
  "^\\s+File \"[^\"]*site-packages/cocotb/regression\\.py\"",
  "^\\s+(exec\\(co, module\\.__dict__\\)|import ssl|plugin = ep\\.load\\(\\))$",
  "^\\s+(pytest_conf = Config\\.fromdictargs\\(|config\\.parse\\(args, addopts=False\\))$",
  "^\\s+(module = import_module\\(match\\.group\\('module'\\)\\)|return _bootstrap\\._gcd_import)",
  "^\\s+self\\.pluginmanager\\.load_setuptools_entrypoints",
  "^\\s+from \\._core\\._sockets import",
  "^\\s+import _ssl\\s",
  # the bare header of that suppressed trace; a real failure still shows its
  # File "..." frames and the assertion line
  "^\\s{20,}Traceback \\(most recent call last\\):$",
  # results table: keep the TESTS= tally and any non-PASS row, drop passing rows,
  # the column header and the rule lines
  "^\\s*\\*\\* \\S+\\s+PASS\\s+[0-9]",
  "^\\s*\\*\\* TEST\\s+STATUS\\s",
  "^\\s*\\*{20,}\\s*$",
]
max_lines = 120
on_empty = "soc-sim: no output (check the suite actually ran)"

