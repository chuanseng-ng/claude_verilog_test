# ---------------------------------------------------------------------------
# direct verilator invocations (lint or build outside make)
# ---------------------------------------------------------------------------
[filters.verilator]
description = "Verilator lint/build — keep %Error and %Warning lines, drop the banner"
match_command = "^(nix\\s+(develop|shell)\\s+(--command\\s+)?)?(rtk\\s+)?verilator\\b"
strip_ansi = true
filter_stderr = true
truncate_lines_at = 220
strip_lines_matching = [
  "^\\s*$",
  "^warning: Git tree ",
  "^soc sim\\+lint env ready",
  "^Python/cocotb come from system",
  "^- V e r i l a t i o n",
  "^- Verilator: ",
  "^\\s+[0-9]+ \\|",
  "^\\s+\\|",
  "^\\s+\\^~*$",
  "^\\s+\\.\\.\\. ",
]
max_lines = 80
on_empty = "verilator: clean"

[[tests.verilator]]
name = "keeps warnings, drops banner and source echo"
input = """
- V e r i l a t i o n   R e p o r t: Verilator 5.048
- Verilator: Built from 0.069 MB sources in 3 modules
%Warning-WIDTHTRUNC: rtl/soc/pmu.sv:88:21: Operator ASSIGN expects 32 bits
   88 |   assign x = y;
      |            ^
%Error: Exiting due to 1 warning(s)
"""
expected = "%Warning-WIDTHTRUNC: rtl/soc/pmu.sv:88:21: Operator ASSIGN expects 32 bits\n%Error: Exiting due to 1 warning(s)"

[[tests.verilator]]
name = "clean lint collapses to one line"
input = """
- V e r i l a t i o n   R e p o r t: Verilator 5.048
- Verilator: Built from 0.069 MB sources in 3 modules
- Verilator: Walltime 0.015 s (elab=0.002, cvt=0.006, bld=0.000)
"""
expected = "verilator: clean"

# ---------------------------------------------------------------------------
# sv2v — used by the PD frontend (make <pdk>-soc-sv2v). Errors only.
# ---------------------------------------------------------------------------
[filters.sv2v]
description = "sv2v SystemVerilog->Verilog conversion — errors only"
match_command = "^(nix\\s+(develop|shell)\\s+(--command\\s+)?)?(rtk\\s+)?sv2v\\b"
strip_ansi = true
filter_stderr = true
truncate_lines_at = 220
keep_lines_matching = [
  "[Ee]rror",
  "[Ww]arning",
  "not found",
  "Unsupported",
]
max_lines = 60
on_empty = "sv2v: ok"

[[tests.sv2v]]
name = "errors kept, converted RTL dropped"
input = """
module soc_top (input wire clk_i);
  wire [31:0] x;
endmodule
Error: unsupported construct at rtl/soc/pmu.sv:12
"""
expected = "Error: unsupported construct at rtl/soc/pmu.sv:12"

[[tests.sv2v]]
name = "clean conversion collapses"
input = "module soc_top (input wire clk_i);\nendmodule"
expected = "sv2v: ok"

# ---------------------------------------------------------------------------
# beads issue tracker — strip table chrome
# ---------------------------------------------------------------------------
[filters.bd]
description = "beads (bd) output — drop blank lines and box-drawing chrome"
match_command = "^bd\\s+(show|list|ready|stats|blocked|memories)\\b"
strip_ansi = true
truncate_lines_at = 200
strip_lines_matching = [
  "^\\s*$",
  "^[-=_+|]{3,}$",
  "^[\\s|+]*[-=]{3,}[\\s|+]*$",
]
max_lines = 80
on_empty = "bd: no results"

[[tests.bd]]
name = "drops rule lines, keeps rows"
input = """
ID        STATUS  TITLE
--------------------------------
zud       open    Cut EDA tool-output tokens

================================
"""
expected = "ID        STATUS  TITLE\nzud       open    Cut EDA tool-output tokens"
