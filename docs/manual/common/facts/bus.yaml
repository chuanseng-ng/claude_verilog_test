# Words for the generated signal and parameter tables of the bus fabric.
# The RTL gives the names, directions, widths and defaults. This file gives the rest.
# Run: python tools/docs/gen_fact_tables.py
# A description in backticks is set as code. Every port and parameter needs an entry.
# domain: the name of a clock port of the same module, or clock, async or quasi-static.
family: bus
modules:
  axi4_crossbar:
    rtl: rtl/soc/axi4_crossbar.sv
    deps: [rtl/soc/axi_pkg.sv]
    label: tm:mod:axi4-crossbar
    params:
      N_MASTERS:
        legal: "1 or more; 4 in the SoC"
        description: "Number of master ports. The tables show the module default. The SoC sets 4."
      N_SLAVES:
        legal: "1 or more; 3 in the SoC"
        description: "Number of slave ports. The tables show the module default. The SoC sets 3."
      AW:
        legal: "32 in the SoC"
        description: "Width of an address."
      DW:
        legal: "32 in the SoC"
        description: "Width of a data word."
      SW:
        legal: "`DW`/8"
        description: "Width of the write strobes. One bit for each byte of a data word."
      IW:
        legal: "enough bits for the index of `N_MASTERS` masters; 4 in the SoC"
        description: "Width of the ID that the crossbar drives to a slave. The ID is the index of the master. A narrower value drops the upper bits of the index without a message."
      LENW:
        legal: "8 in the SoC"
        description: "Width of the burst length fields `AxLEN`."
      SLV_BASE:
        legal: "one inclusive base address for each slave"
        description: "Base address of each slave window. It has one 32-bit field for each slave, and the lowest field is slave 0. The SoC passes `SOC_SLV_BASE`."
      SLV_LIMIT:
        legal: "one inclusive limit address for each slave"
        description: "Last address of each slave window. The SoC passes `SOC_SLV_LIMIT`. The crossbar keeps the last matching slave when windows overlap."
    ports:
      clk:
        domain: clock
        description: "Clock of the crossbar. In the SoC it is `core_clk`."
      rst_n:
        domain: clk
        description: "Active-low synchronous reset. In the SoC it is `core_rst_n`."
      m_awaddr:
        domain: clk
        description: "Write address of the master of this index. The crossbar decodes it in the cycle that the engine accepts the address."
      m_awlen:
        domain: clk
        description: "Burst length minus 1 of the write of the master of this index. The crossbar passes it to the slave."
      m_awsize:
        domain: clk
        description: "Size code of a beat of the write of the master of this index. The crossbar passes it to the slave."
      m_awburst:
        domain: clk
        description: "Burst type of the write of the master of this index. The crossbar passes it to the slave."
      m_awvalid:
        domain: clk
        description: "The the master of this index offers a write address."
      m_awready:
        domain: clk
        description: "The crossbar takes the write address of the master of this index. See the text about the second ready window."
      m_wdata:
        domain: clk
        description: "Write data of the master of this index."
      m_wstrb:
        domain: clk
        description: "Write strobes of the master of this index."
      m_wlast:
        domain: clk
        description: "The beat is the last beat of the write of the master of this index. The crossbar ends the data phase on this bit."
      m_wvalid:
        domain: clk
        description: "The the master of this index offers a write data beat."
      m_wready:
        domain: clk
        description: "The crossbar takes the write data beat of the master of this index. It is high only while the write engine of the granted slave is in its data phase, or while the decode-error engine of the master sinks data."
      m_bresp:
        domain: clk
        description: "Write response to the master of this index. The response of the slave, or DECERR from the decode-error engine."
      m_bvalid:
        domain: clk
        description: "The crossbar offers the write response to the master of this index."
      m_bready:
        domain: clk
        description: "The the master of this index takes the write response."
      m_araddr:
        domain: clk
        description: "Read address of the master of this index. The crossbar decodes it in the cycle that the engine accepts the address."
      m_arlen:
        domain: clk
        description: "Burst length minus 1 of the read of the master of this index. The crossbar passes it to the slave."
      m_arsize:
        domain: clk
        description: "Size code of a beat of the read of the master of this index. The crossbar passes it to the slave."
      m_arburst:
        domain: clk
        description: "Burst type of the read of the master of this index. The crossbar passes it to the slave."
      m_arvalid:
        domain: clk
        description: "The the master of this index offers a read address."
      m_arready:
        domain: clk
        description: "The crossbar takes the read address of the master of this index. See the text about the second ready window."
      m_rdata:
        domain: clk
        description: "Read data to the master of this index. It is 0 for a decode-error beat."
      m_rresp:
        domain: clk
        description: "Read response to the master of this index. The response of the slave, or DECERR from the decode-error engine."
      m_rlast:
        domain: clk
        description: "The beat is the last beat of the read to the master of this index."
      m_rvalid:
        domain: clk
        description: "The crossbar offers a read data beat to the master of this index."
      m_rready:
        domain: clk
        description: "The the master of this index takes the read data beat."
      s_awid:
        domain: clk
        description: "ID of the write: the index of the granted master."
      s_awaddr:
        domain: clk
        description: "Address of the write, taken from the register that captured it."
      s_awlen:
        domain: clk
        description: "Burst length minus 1 of the write."
      s_awsize:
        domain: clk
        description: "Size code of a beat of the write."
      s_awburst:
        domain: clk
        description: "Burst type of the write."
      s_awvalid:
        domain: clk
        description: "The crossbar offers the write address to the slave of this index. It is high in the address state of the write engine."
      s_awready:
        domain: clk
        description: "Slave `s` takes the write address."
      s_wdata:
        domain: clk
        description: "Write data of the granted master. It is 0 outside the data state."
      s_wstrb:
        domain: clk
        description: "Write strobes of the granted master. They are 0 outside the data state."
      s_wlast:
        domain: clk
        description: "Last-beat flag of the granted master. It is 0 outside the data state."
      s_wvalid:
        domain: clk
        description: "The write data of the granted master is valid. It is 0 outside the data state."
      s_wready:
        domain: clk
        description: "Slave `s` takes the write data beat."
      s_bid:
        domain: clk
        description: "Write response ID from the slave of this index. The crossbar does not use it."
      s_bresp:
        domain: clk
        description: "Write response of the slave of this index."
      s_bvalid:
        domain: clk
        description: "Slave `s` offers the write response."
      s_bready:
        domain: clk
        description: "The crossbar takes the write response. It follows `m_bready` of the granted master in the response state."
      s_arid:
        domain: clk
        description: "ID of the read: the index of the granted master."
      s_araddr:
        domain: clk
        description: "Address of the read, taken from the register that captured it."
      s_arlen:
        domain: clk
        description: "Burst length minus 1 of the read."
      s_arsize:
        domain: clk
        description: "Size code of a beat of the read."
      s_arburst:
        domain: clk
        description: "Burst type of the read."
      s_arvalid:
        domain: clk
        description: "The crossbar offers the read address to the slave of this index. It is high in the address state of the read engine."
      s_arready:
        domain: clk
        description: "Slave `s` takes the read address."
      s_rid:
        domain: clk
        description: "Read data ID from the slave of this index. The crossbar does not use it."
      s_rdata:
        domain: clk
        description: "Read data of the slave of this index."
      s_rresp:
        domain: clk
        description: "Read response of the slave of this index."
      s_rlast:
        domain: clk
        description: "Slave `s` marks the last read beat. The read engine ends on this bit."
      s_rvalid:
        domain: clk
        description: "Slave `s` offers a read data beat."
      s_rready:
        domain: clk
        description: "The crossbar takes the read data beat. It follows `m_rready` of the granted master in the data state."
  soc_bus:
    rtl: rtl/soc/soc_bus.sv
